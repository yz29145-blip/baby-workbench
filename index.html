<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>宝宝育儿工作台</title>
<meta name="theme-color" content="#14B8A6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="育儿工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
/* ============================================================
   宝宝育儿工作台 · 现代清新工具类配色系统（v2.2）
   全局统一主色 + 中性冷灰 + 低饱和语义色
   主色（强调）：柔和薄荷青 #56B8A6
   辅助：平静蓝 #63A8D8　警示：暖浅橙 #F2A968
   成功：浅翠绿 #72C884　错误：珊瑚红 #E27575
   页面区分仅通过低饱和 --pAcc 小面积点缀实现
   ============================================================ */
:root{
  --c50:#E2F6F3;
  --c100:#B9EDE5;
  --c200:#86DDD0;
  --c300:#52C9B9;
  --c400:#27B0A0;
  --c500:#14B8A6;
  --c600:#0E9E8E;
  --c700:#0B8174;
  --c800:#096258;
  --c900:#064A42;
  --acc:var(--c500);
  --acc2:var(--c600);
  --accL:var(--c50);
  --accD:var(--c700);
  --accT:#FFFFFF;
  --green:#1FA971;
  --green2:#E6F6EE;
  --amber:#F5A524;
  --amber2:#FDF1DD;
  --red:#F2555A;
  --red2:#FDECEC;
  --blue:#3E9BDC;
  --blue2:#E8F3FB;
  --cyan:#14B8AC;
  --cyan2:#E2F6F4;
  --purple:#8B7BD8;
  --purple2:#F0ECFB;
  --pink:#EC6FA0;
  --pink2:#FCEAF2;
  --bg:#F5F6F8;
  --bg2:#FFFFFF;
  --bg3:#EEF0F3;
  --bgw:#FFFFFF;
  --tx:#1B1C20;
  --tx2:#5A5E66;
  --tx3:#9A9EA6;
  --line:#ECEDF0;
  --line2:#E1E4E8;
  --sd:0 1px 2px rgba(20,25,30,.04),0 10px 30px rgba(20,25,30,.05);
  --sd2:0 18px 50px rgba(20,25,30,.14);
  --sdA:0 8px 20px color-mix(in srgb,var(--acc) 22%,transparent);
  --hl:inset 0 1px 0 rgba(255,255,255,.75);
  --r:18px;
  --r2:13px;
  --r3:9px;
  --pAcc:var(--acc);
  --pAcc2:var(--acc2);
  --pAccL:var(--accL);
  --pAccD:var(--accD);
  --safe:env(safe-area-inset-bottom,0px)
}
/* 全站统一薄荷青，不再按页乱变 */
html[data-theme="dark"]{
  --c50:#163B36;
  --c100:#1F544C;
  --c200:#286A60;
  --c300:#338577;
  --c400:#5FB3A4;
  --c500:#86C9BC;
  --c600:#AEDBD0;
  --c700:#D6ECE6;
  --c800:#EAF6F2;
  --c900:#FFFFFF;
  --acc:var(--c400);
  --acc2:var(--c500);
  --accL:var(--c900);
  --accT:#0C2A26;
  --blue:#8FB8E0;
  --blue2:#13242F;
  --amber:#E8B27E;
  --amber2:#2E2515;
  --green:#8FCF99;
  --green2:#0F2A1E;
  --red:#E89A96;
  --red2:#2E1B1C;
  --cyan:#8FC9C0;
  --cyan2:#10262A;
  --purple:#A6B6C8;
  --purple2:#211C30;
  --pink:#E6A6B6;
  --pink2:#2A1C25;
  --bg:#0E0F12;
  --bg2:#1A1C20;
  --bg3:#141619;
  --bgw:#1A1C20;
  --tx:#ECEEF1;
  --tx2:#A7ABB2;
  --tx3:#767B83;
  --line:#26292F;
  --line2:#33373F;
  --sd:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.32);
  --sd2:0 18px 50px rgba(0,0,0,.5);
  --sdA:0 8px 20px color-mix(in srgb,var(--acc) 30%,transparent);
  --chipBg:color-mix(in srgb,var(--acc) 16%,var(--bg2));
  --chipTx:var(--acc)
}
/* 暗色也统一薄荷青，不再按页乱变 */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation
}
html,body{
  margin:0;
  padding:0;
  height:100%;
  scrollbar-width:none;
  -ms-overflow-style:none
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--tx);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  transition:background .3s
}
/* 轻科技感：极淡青调渐变 + 细点阵背景 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:radial-gradient(130% 60% at 50% -12%, #E6F8F3 0%, #EFF5FB 42%, #FBFDFE 100%),
    radial-gradient(circle at 1px 1px, rgba(20,184,166,.05) 1px, transparent 0);
  background-size:auto, 22px 22px
}
button,input,select,textarea{
  font-family:inherit;
  font-size:inherit;
  color:inherit
}
a{
  color:var(--acc);
  text-decoration:none
}
/* 隐藏主内容区可见滚动条（仍保留滚动能力）；仅弹层内保留细滚动条 */
html::-webkit-scrollbar,body::-webkit-scrollbar,.wrap::-webkit-scrollbar{
  width:0;
  height:0;
  display:none
}
.sh-b{
  scrollbar-width:thin;
  padding:15px 16px;
  overflow-y:auto;
  flex:1;
  -webkit-overflow-scrolling:touch
}
.sh-b::-webkit-scrollbar{
  width:6px
}
.sh-b::-webkit-scrollbar-thumb{
  background:var(--line2);
  border-radius:3px
}
/* 顶部图标按钮（全局统一主色悬停） */
.icobtn{
  width:37px;
  height:37px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:var(--bg2);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex:none;
  font-size:16px;
  transition:.15s;
  color:var(--tx2)
}
.icobtn:hover{
  border-color:var(--acc);
  background:var(--accL);
  color:var(--acc)
}
.icobtn:active{
  transform:scale(.92)
}
.sync-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--tx3);
  flex:none;
  cursor:pointer;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--tx3) 22%,transparent)
}
.sync-dot.on{
  background:var(--green);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)
}
.sync-dot.busy{
  background:var(--amber);
  animation:pulse 1s infinite;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 25%,transparent)
}
.sync-dot.err{
  background:var(--red);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 25%,transparent)
}
/* ---------- 布局 ---------- */
#app{
  display:flex;
  min-height:100%
}
.side{
  display:none
}
.main{
  flex:1;
  min-width:0;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(84px + var(--safe));
  transition:padding-bottom .2s
}
.main.no-tab{
  padding-bottom:calc(14px + var(--safe))
}
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:0 14px
}
/* ---------- 底部导航（高亮统一主色） ---------- */
.tabbar{
  position:fixed !important;
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  z-index:40 !important;
  background:color-mix(in srgb,var(--bg2) 88%,transparent) !important;
  backdrop-filter:saturate(180%) blur(18px) !important;
  -webkit-backdrop-filter:saturate(180%) blur(18px) !important;
  border-top:1px solid var(--line) !important;
  display:flex !important;
  padding:0 6px var(--safe) !important;
  box-shadow:0 -1px 0 rgba(255,255,255,.6),0 -8px 24px rgba(15,40,38,.05) !important;
  align-items:center !important;
  justify-content:space-around !important;
  gap:0 !important;
  height:calc(56px + var(--safe)) !important;
  box-sizing:border-box !important
}
.tabbar button{
  flex:1;
  background:none;
  border:0;
  padding:4px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:var(--tx3);
  cursor:pointer;
  border-radius:12px;
  transition:.18s;
  min-width:0;
  height:44px
}
.tabbar button .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  font-size:19px;
  line-height:1
}
.tabbar button .ti .ico{
  display:block;
  width:22px;
  height:22px
}
.tabbar button .tl{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:12px;
  text-align:center;
  font-size:10px;
  font-weight:700;
  letter-spacing:.2px;
  line-height:1
}
.tabbar button.on .ti{
  color:var(--acc)
}
.tabbar button.on .tl{
  color:var(--acc);
  font-weight:800 !important
}
.tabbar.hidden{
  display:none !important
}
/* ---------- 卡片（统一柔和轻阴影 + 统一圆角） ---------- */
.card{
  background:rgba(255,255,255,.86) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r) !important;
  box-shadow:var(--sd),var(--hl) !important;
  padding:15px !important;
  margin-bottom:12px !important
}
.card.pad0{
  padding:0 !important;
  overflow:hidden !important
}
.card.tap{
  cursor:pointer !important;
  transition:transform .15s,box-shadow .15s !important
}
.card.tap:active{
  transform:scale(.985) !important
}
.sec-t{
  display:flex !important;
  align-items:center !important;
  gap:8px !important;
  margin:20px 0 10px !important;
  font-size:14px !important;
  font-weight:800 !important;
  color:var(--tx) !important;
  letter-spacing:-.2px !important;
  padding:0 2px !important
}
.sec-t:before{
  display:none
}
.ico{
  width:20px;
  height:20px;
  display:inline-flex !important;
  flex:none;
  stroke-width:2;
  fill:none;
  stroke:currentColor;
  stroke-linecap:round;
  stroke-linejoin:round;
  vertical-align:middle !important
}
.sec-t .sti{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  color:#fff !important;
  margin-right:1px;
  flex:none !important;
  width:26px !important;
  height:26px !important;
  border-radius:9px !important;
  background:linear-gradient(135deg,var(--acc),var(--acc2)) !important;
  box-shadow:0 4px 10px rgba(20,184,166,.22) !important
}
.sec-t .sti .ico{
  width:15px !important;
  height:15px !important
}
.tabbar .ti .ico{
  width:22px;
  height:22px
}
.qbtn .qi .ico{
  width:26px;
  height:26px
}
.nv .nvi .ico{
  width:18px;
  height:18px
}
.pcard .pc-ic .ico{
  width:18px;
  height:18px
}
.logo .lg .ico{
  width:18px;
  height:18px
}
.sec-t .more{
  margin-left:auto !important;
  font-size:12.5px !important;
  color:var(--accD) !important;
  font-weight:700 !important;
  cursor:pointer !important;
  background:var(--accL) !important;
  padding:5px 11px !important;
  border-radius:12px !important;
  transition:.15s;
  display:inline-flex;
  align-items:center
}
.sec-t .more:active{
  transform:scale(.94)
}
/* 月龄英雄卡（柔和白底 + 薄荷点缀，无大面积彩色） */
.hero{
  display:flex !important;
  flex-direction:column !important;
  background:linear-gradient(165deg,var(--accL) 0%,#FFFFFF 70%) !important;
  color:var(--tx);
  border:1px solid color-mix(in srgb,var(--acc) 16%,var(--line)) !important;
  border-radius:20px !important;
  padding:18px 20px 20px 18px !important;
  margin:14px 0 14px;
  box-shadow:var(--sd),var(--hl) !important;
  position:relative !important;
  overflow:hidden !important;
  transition:.2s
}
.hero:active{
  transform:scale(.985)
}
.hero:before{
  content:"";
  position:absolute;
  left:-36px;
  top:-46px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:var(--accL);
  opacity:.85
}
.hero:after{
  content:"";
  position:absolute;
  right:24px;
  bottom:-54px;
  width:108px;
  height:108px;
  border-radius:50%;
  background:color-mix(in srgb,var(--acc) 14%,transparent)
}
.hero .hin{
  position:relative !important;
  display:flex !important;
  align-items:center !important;
  gap:14px !important;
  z-index:1 !important
}
/* 云端同步提示：置于档案卡内部最底部，与卡片底边（横线）对齐 */
.hero .hero-sync{
  margin-top:auto !important;
  position:relative !important;
  z-index:1 !important;
  margin-bottom:0 !important
}
.hero h2{
  margin:0;
  font-size:16px;
  font-weight:700;
  color:var(--tx2);
  letter-spacing:.2px
}
.hero .age{
  font-size:34px;
  font-weight:900;
  line-height:1.08;
  margin:5px 0 3px;
  letter-spacing:-1.2px;
  color:var(--tx)
}
.hero .meta{
  font-size:12.5px;
  color:var(--tx2);
  font-weight:500
}
.hero .wh{
  display:flex;
  gap:14px;
  margin-top:8px;
  font-size:14px;
  font-weight:800;
  color:var(--tx)
}
.hero .wh small{
  font-size:10px;
  font-weight:600;
  color:var(--tx3);
  margin-left:1px
}
.hero .wh .muted{
  color:var(--tx3);
  font-weight:600;
  font-size:12px
}
.pcards{
  display:none !important;
  gap:8px;
  margin-top:14px;
  grid-template-columns:repeat(4,1fr);
  justify-items:center
}
.pcard{
  flex:1;
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px 4px;
  text-align:center;
  cursor:pointer;
  transition:transform .12s,background .15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  justify-content:center;
  box-shadow:var(--sd)
}
.pcard:active{
  transform:scale(.97);
  background:var(--bg3)
}
.pcard .pc-ic{
  width:32px;
  height:32px;
  border-radius:10px;
  margin:0 auto 6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  color:var(--pAcc);
  box-shadow:var(--sd);
  flex:none;
  background:var(--pAccL)
}
.pcard .pc-l{
  font-size:11px;
  font-weight:700;
  color:var(--tx2);
  text-align:center;
  line-height:1.2
}
.hero .av{
  font-size:40px;
  line-height:1;
  position:relative
}
.hero .chips{
  display:flex;
  gap:6px;
  margin-top:12px;
  flex-wrap:wrap;
  position:relative
}
.hero .chip{
  background:var(--accL);
  border-radius:18px;
  padding:4px 11px;
  font-size:11.5px;
  font-weight:700;
  color:var(--tx2)
}
/* 统计格 */
.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px
}
.stat{
  border:1.5px solid var(--line);
  border-radius:var(--r2);
  padding:11px 5px;
  text-align:center;
  cursor:pointer;
  transition:.16s;
  background:var(--bg2);
  position:relative;
  overflow:hidden
}
.stat:active{
  transform:scale(.95)
}
.stat .n{
  font-size:21px;
  font-weight:900;
  line-height:1.15;
  letter-spacing:-.6px;
  color:var(--tx)
}
.stat .l{
  font-size:10.5px;
  color:var(--tx3);
  font-weight:700;
  margin-top:2px
}
.stat.s-mint{
  background:var(--accL);
  border-color:transparent
}
.stat.s-amber{
  background:var(--amber2);
  border-color:transparent
}
.stat.s-blue{
  background:var(--blue2);
  border-color:transparent
}
.stat.s-green{
  background:var(--green2);
  border-color:transparent
}
/* 列表项 */
.item{
  display:flex !important;
  align-items:center !important;
  gap:12px !important;
  padding:13px 14px !important;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  position:relative;
  transition:background .14s;
  background:var(--bg2)
}
.item:last-child{
  border-bottom:0
}
.item:hover{
  background:var(--bgw)
}
.item:active{
  background:var(--bg3)
}
.item .ck{
  width:24px !important;
  height:24px !important;
  border-radius:8px;
  border:2px solid var(--line2);
  flex:none;
  margin-top:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  color:#fff;
  background:var(--bg2);
  transition:.18s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer;
  font-weight:700
}
.item .ck:hover{
  border-color:var(--green);
  transform:scale(1.1)
}
.item .ck.done{
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border-color:transparent;
  transform:scale(1)
}
.item .ck.ck-dev{
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--bg2);
  border:2px solid var(--line2);
  color:transparent;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
  flex:none;
  margin-top:0;
  transition:.18s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer
}
.item .ck.ck-dev .ck-ic{
  font-size:15px;
  font-weight:900;
  line-height:1
}
.item .ck.ck-dev:hover{
  border-color:var(--green);
  transform:scale(1.08)
}
.item .ck.ck-dev.on{
  background:linear-gradient(135deg,var(--green),var(--acc));
  border-color:transparent;
  color:#fff;
  box-shadow:var(--sdA)
}
.item .ck.ck-dev.on .ck-ic{
  transform:scale(1.1)
}
.item.dev{
  align-items:center
}
.dev-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
  flex:none
}
.ms-btn{
  background:linear-gradient(120deg,#F6B98A,#F2A968);
  color:#5a3a00;
  border:none
}
.ms-btn:active{
  transform:scale(.95)
}
.ms-badge{
  font-size:11px;
  font-weight:800;
  color:#0F3D22;
  background:linear-gradient(120deg,#8FD79C,#72C884);
  padding:3px 9px;
  border-radius:20px;
  white-space:nowrap
}
.item .ic{
  width:40px !important;
  height:40px !important;
  border-radius:12px !important;
  flex:none !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  font-size:17px;
  margin-top:0
}
.item .bd{
  flex:1 !important;
  min-width:0 !important;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:3px
}
.item .t1{
  font-size:14.5px !important;
  font-weight:700 !important;
  line-height:1.3 !important;
  letter-spacing:-.1px;
  color:var(--tx) !important;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.item .t1.done{
  color:var(--tx3) !important;
  font-weight:500;
  text-decoration:line-through !important
}
.item .t2{
  font-size:12.5px !important;
  color:var(--tx2) !important;
  margin-top:2px !important;
  display:flex !important;
  gap:5px !important;
  flex-wrap:wrap !important;
  align-items:center !important;
  font-variant-numeric:tabular-nums;
  line-height:1.4
}
.item .rt{
  flex:none !important;
  margin-top:0;
  margin-left:auto !important;
  padding-left:8px;
  display:flex;
  align-items:center;

  touch-action:pan-x
}
/* 时光轴标签过多（11个），居中会被截断：改为左对齐、小间距、留右侧安全区 */

/* 同页分类横滑容器（小红书式 ViewPager：标签 + 内容整块横滑、平滑吸附、标签跟随高亮） */
.vp{
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  /* 必须为 auto：设 smooth 后，浏览器"把聚焦按钮滚入可视区"的自发滚动也会带动画，
     表现为点月份/体重时内容区自己滑一遍、顶部标签依次高亮。
     点击标签的平滑切换改由 JS scrollTo({behavior:'smooth'}) 显式控制，效果不变。 */
  scroll-behavior:auto;
  scrollbar-width:none;
  overscroll-behavior-x:contain;
  /* 仅声明 pan-x：竖向手势不被本元素吞掉，从而冒泡到页面（body）做竖向滚动。
     原 pan-x pan-y 在 overflow-y:hidden 时会拦截竖向手势、导致时光轴等长列表整页滑不动。 */
  touch-action:pan-x;
  margin-top:6px
}
.vp::-webkit-scrollbar{display:none}
.vpp{
  flex:0 0 100%;
  width:100%;
  min-width:100%;
  box-sizing:border-box;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  padding-bottom:12px
}
/* 含横向 ViewPager 的视图（待办/健康/时光轴）：占满视口、竖向滚动交给面板内部承载。
   关键根因：.vp 是 overflow-x:auto 的横向滚容器，按 CSS 规范它必然是竖向 scroll container，
   会捕获并丢弃竖向手势（不冒泡给整页），导致长内容「滑不动」（之前 touch-action:pan-x 在真机无效）。
   这里让 .vp 占满视口剩余高度，.vpp 用 overflow-y:auto 在自身内部滚动——竖向手势落在可竖向滚的子元素上即可正常滚动；
   标签条(.segs)固定在顶部，体验同小红书/抖音式 ViewPager。 */
.vp-view{
  display:flex;
  flex-direction:column;
  height:calc(100vh - 56px - var(--safe,0px));
  height:calc(100dvh - 56px - var(--safe,0px));
  overflow:hidden
}
.vp-view > .segs{ flex:none; }
.vp-view > .vp{ flex:1 1 auto; min-height:0; }
.vp-view .vpp{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
@media (min-width:861px){

/* 提示条 */
@media(max-width:410px){
  .qgrid.q-sm{grid-template-columns:repeat(2,1fr)}
  .more-grid{grid-template-columns:repeat(2,1fr)}
}
.hide{
  display:none !important
}
/* ===== 疫苗分组卡 ===== */
.vax{
  border-bottom:1px solid var(--line)
}
.vax:last-child{
  border-bottom:none
}
.vax.off{
  opacity:.5
}
.vax-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:11px 12px 7px
}
.vax-t{
  flex:1;
  min-width:0
}
.vax-t .t1{
  font-size:14.5px;
  font-weight:800;
  color:var(--tx)
}
.vax-t .t2{
  margin-top:4px;
  display:flex;
  gap:5px;
  flex-wrap:wrap
}
.vax-a{
  display:flex;
  align-items:center;
  gap:7px;
  flex-shrink:0
}
.mini{
  font-size:11.5px;
  font-weight:700;
  color:var(--pAcc);
  background:var(--pAccL);
  border:none;
  border-radius:8px;
  padding:5px 9px;
  cursor:pointer;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:4px !important
}
.mini.devlog{
  background:var(--pAcc);
  color:#fff;
  margin-left:8px;
  flex:none
}
.mini.devlog:active{
  transform:scale(.94)
}
.vax-d{
  padding:0 12px 10px
}
.vd{
  display:flex;
  align-items:center;
  gap:12px !important;
  padding:8px 0;
  border-top:1px dashed var(--line)
}
.vd:first-child{
  border-top:none
}
.vd .t1{
  font-size:13.5px;
  color:var(--tx)
}
.vd .t2{
  font-size:11.5px;
  color:var(--tx3);
  margin-top:2px
}
.vd .ck{
  width:24px !important;
  height:24px !important;
  border-radius:8px;
  border:2px solid var(--line2);
  flex:none;
  margin-top:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:#fff;
  background:var(--bg2);
  transition:.18s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer
}
.vd.done{
  background:color-mix(in srgb,var(--green) 9%,var(--bg2));
  border-radius:10px;
  padding-left:8px;
  padding-right:8px
}
.vd.done .t1{
  color:var(--tx2)
}
.vd.done .ck{
  background:linear-gradient(135deg,var(--green),var(--acc));
  border-color:transparent;
  color:#fff
}
/* 安卓 PWA 安装引导条（主色） */
#installBar{
  position:fixed;
  left:10px;
  right:10px;
  bottom:74px;
  z-index:60;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;
  border-radius:14px;
  padding:11px 13px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 8px 24px rgba(16,24,40,.18)
}
#installBar .ib-t{
  flex:1;
  font-size:12.5px;
  line-height:1.4;
  display:flex !important;
  align-items:center !important;
  gap:6px !important
}
#installBar .ib-t b{
  font-weight:800
}
#installBar .ib-a{
  display:flex;
  gap:6px;
  flex-shrink:0
}
#installBar button{
  font-size:12.5px;
  font-weight:800;
  border:none;
  border-radius:9px;
  padding:7px 12px;
  cursor:pointer
}
#installBar #installGo{
  background:#fff;
  color:var(--acc)
}
#installBar #installX{
  background:rgba(255,255,255,.25);
  color:#fff;
  padding:7px 10px
}
/* ===== 科普链接 / 护理知识 / 速查 ===== */
/* 颜色区分的可点开科普链接（低饱和派生色，仅点缀） */
.glink{
  display:inline-flex;
  align-items:center;
  padding:3px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  border:1.5px solid transparent;
  -webkit-tap-highlight-color:transparent;
  transition:.15s;
  user-select:none;
  line-height:1.5
}
.glink:active{
  transform:scale(.94)
}
.g-nip{
  background:var(--green2);
  color:var(--green);
  border-color:color-mix(in srgb,var(--green) 28%,transparent)
}
.g-non{
  background:var(--purple2);
  color:var(--purple);
  border-color:color-mix(in srgb,var(--purple) 28%,transparent)
}
.g-gen{
  background:var(--blue2);
  color:var(--blue);
  border-color:color-mix(in srgb,var(--blue) 28%,transparent)
}
.g-chk{
  background:var(--cyan2);
  color:var(--cyan);
  border-color:color-mix(in srgb,var(--cyan) 28%,transparent)
}
.g-dev{
  background:var(--pAccL);
  color:var(--pAcc);
  border-color:color-mix(in srgb,var(--pAcc) 28%,transparent)
}
.g-feed{
  background:var(--amber2);
  color:var(--amber);
  border-color:color-mix(in srgb,var(--amber) 28%,transparent)
}
.g-bath{
  background:var(--blue2);
  color:var(--blue);
  border-color:color-mix(in srgb,var(--blue) 28%,transparent)
}
.g-umb{
  background:var(--amber2);
  color:var(--amber);
  border-color:color-mix(in srgb,var(--amber) 28%,transparent)
}
.g-burp{
  background:var(--cyan2);
  color:var(--cyan);
  border-color:color-mix(in srgb,var(--cyan) 28%,transparent)
}
.g-dia{
  background:var(--pink2);
  color:var(--pink);
  border-color:color-mix(in srgb,var(--pink) 28%,transparent)
}
.g-slp{
  background:var(--purple2);
  color:var(--purple);
  border-color:color-mix(in srgb,var(--purple) 28%,transparent)
}
.g-touch{
  background:var(--green2);
  color:var(--green);
  border-color:color-mix(in srgb,var(--green) 28%,transparent)
}
/* 疫苗卡「介绍」幽灵药丸：与页面点缀色 outline */
.pill.g-ghost{
  background:transparent;
  border-color:color-mix(in srgb,var(--pAcc) 45%,transparent);
  color:var(--pAcc);
  box-shadow:none
}
/* 护理知识面板 */
.care-kb{
  background:linear-gradient(120deg,var(--pAccL),color-mix(in srgb,var(--pAccL) 55%,var(--bg2)));
  border:1.5px solid color-mix(in srgb,var(--pAcc) 22%,transparent);
  border-radius:var(--r2);
  padding:12px 13px;
  margin-bottom:12px
}
.ckb-h{
  font-size:13px;
  font-weight:800;
  color:var(--tx);
  margin-bottom:9px
}
.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}
/* 育儿速查：搜索 + 分类 */
.docs-bar{
  margin-bottom:12px
}
.docs-bar .inp{
  margin-bottom:10px
}
.doc-card .t2 .tag{
  margin-right:5px
}
/* 文档内可折叠小节 */
.dsec{
  border-top:1px solid var(--line);
  padding:1px 0
}
.dsec:first-of-type{
  border-top:none
}
.dsec summary{
  list-style:none;
  cursor:pointer;
  padding:13px 2px;
  font-size:15px;
  font-weight:800;
  color:var(--tx);
  display:flex;
  align-items:center;
  gap:9px;
  transition:.15s
}
.dsec summary::-webkit-details-marker{
  display:none
}
.dsec summary:before{
  content:"+";
  display:inline-flex;
  width:20px;
  height:20px;
  border-radius:6px;
  background:var(--pAccL);
  color:var(--pAcc);
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:15px;
  flex:none;
  transition:.2s;
  line-height:1
}
.dsec[open] summary:before{
  content:"–"
}
.dsec[open] summary{
  color:var(--pAcc)
}
.dsec p{
  margin:0 0 12px 31px !important
}
/* ===== v2.0 月龄驱动 / 今日视图 / 数据评估 / 音乐播放器 ===== */
/* 月龄选择条 */
.month-bar{
  display:flex;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 10px;
  scrollbar-width:none;
  scroll-behavior:auto;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch
}
.month-bar::-webkit-scrollbar{
  display:none
}
.month-bar .mb-label{
  flex:none;
  font-size:12.5px;
  font-weight:800;
  color:var(--tx2);
  background:var(--pAccL);
  padding:5px 11px;
  border-radius:16px;
  display:flex;
  align-items:center;
  gap:5px
}
.month-bar button{
  flex:none;
  border:1.5px solid var(--line);
  background:var(--bg2);
  border-radius:20px;
  padding:7px 13px;
  font-size:13px;
  font-weight:700;
  color:var(--tx2);
  cursor:pointer;
  transition:.16s
}
.month-bar button:active{
  transform:scale(.94)
}
.month-bar button.on{
  background:linear-gradient(120deg,var(--pAcc),var(--pAcc2));
  color:#fff;
  border-color:transparent;
  box-shadow:var(--sdA)
}
/* 今日头部 */
.today-hdr{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 4px 8px
}
.today-hdr .t-date{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
  color:var(--tx)
}
.today-hdr .t-wday{
  font-size:12.5px;
  color:var(--tx3);
  font-weight:700;
  background:var(--bg2);
  border:1px solid var(--line);
  padding:3px 9px;
  border-radius:14px
}
.today-hdr .t-age{
  margin-left:auto;
  font-size:12.5px;
  color:var(--pAcc);
  font-weight:800;
  background:var(--pAccL);
  padding:5px 11px;
  border-radius:16px
}
/* 状态条 */
.status-bar{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap
}
.status-bar .st-chip{
  font-size:11.5px;
  font-weight:700;
  padding:4px 10px;
  border-radius:14px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:#fff
}
.status-bar .st-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)
}
.status-bar .st-track{
  flex:1;
  min-width:60px;
  height:5px;
  border-radius:3px;
  background:var(--bg3);
  position:relative;
  overflow:hidden;
  margin-left:2px
}
.status-bar .st-track i{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  border-radius:3px;
  background:linear-gradient(90deg,currentColor,color-mix(in srgb,currentColor 60%,#fff));
  animation:stShine 2.5s ease-in-out infinite
}
/* 早教卡 */
.early-card{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:15px;
  margin-bottom:12px;
  box-shadow:var(--sd)
}
.early-card .ec-h{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:9px
}
.early-card .ec-tag{
  font-size:11px;
  font-weight:800;
  color:var(--pAcc);
  background:var(--pAccL);
  padding:3px 9px;
  border-radius:14px
}
.early-card .ec-title{
  font-size:15.5px;
  font-weight:800;
  letter-spacing:-.2px
}
.early-card .ec-feat{
  font-size:13px;
  color:var(--tx2);
  line-height:1.7;
  margin:6px 0
}
.early-card .ec-tip{
  font-size:12px;
  color:var(--tx3);
  background:var(--bg3);
  padding:8px 11px;
  border-radius:10px;
  margin-top:8px;
  line-height:1.65
}
/* 早教活动瓦片 */
.dev-tile{
  border:1.5px solid var(--line);
  background:var(--bg2);
  border-radius:var(--r2);
  padding:11px 12px;
  margin-bottom:9px;
  transition:.15s;
  cursor:pointer
}
.dev-tile:active{
  transform:scale(.98)
}
.dev-tile .dt-n{
  font-size:14px;
  font-weight:800;
  color:var(--tx);
  display:flex;
  align-items:center;
  gap:6px
}
.dev-tile .dt-n:before{
  content:"▶";
  font-size:9px;
  color:var(--pAcc);
  flex:none
}
.dev-tile .dt-p{
  font-size:12.5px;
  color:var(--tx2);
  margin:5px 0 7px;
  line-height:1.65
}
.dev-tile .dt-meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  font-size:11px
}
.dev-tile .dt-d,.dev-tile .dt-f{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 9px;
  border-radius:10px;
  font-weight:700;
  font-size:11px;
  line-height:1
}
.dev-tile .dt-d .ico,.dev-tile .dt-f .ico{
  width:12px;
  height:12px
}
.dev-tile .dt-d{
  background:var(--blue2);
  color:var(--blue);
  padding:3px 9px;
  border-radius:10px;
  font-weight:700
}
.dev-tile .dt-f{
  background:var(--amber2);
  color:var(--amber);
  padding:3px 9px;
  border-radius:10px;
  font-weight:700
}
/* 道具标签 */
.toy-tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:4px
}
.toy-tag{
  font-size:11.5px;
  font-weight:700;
  padding:4px 10px;
  border-radius:12px;
  background:var(--bg3);
  color:var(--tx2);
  display:inline-flex;
  align-items:center;
  gap:3px
}
/* 数据评估条形图（P3-P97 百分位） */
.stat-bar{
  margin:6px 0 12px
}
.stat-bar .sb-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:6px
}
.stat-bar .sb-head .sb-val{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.5px;
  color:var(--tx)
}
.stat-bar .sb-head .sb-val small{
  font-size:11px;
  font-weight:600;
  color:var(--tx3);
  margin-left:2px
}
.stat-bar .sb-head .sb-tag{
  font-size:11.5px;
  font-weight:800;
  padding:3px 10px;
  border-radius:12px
}
.stat-bar .sb-track{
  position:relative;
  height:20px !important;
  border-radius:10px !important;
  overflow:hidden;
  background:linear-gradient(90deg,var(--red2) 0%,var(--amber2) 14%,var(--green2) 28%,var(--green2) 72%,var(--amber2) 86%,var(--red2) 100%);
  border:1px solid var(--line)
}
.stat-bar .sb-tick{
  position:absolute;
  top:0;
  bottom:0;
  width:1.5px;
  background:var(--line2);
  opacity:.7
}
.stat-bar .sb-tick.major{
  background:var(--tx3);
  opacity:.5;
  width:2px
}
.stat-bar .sb-pin{
  position:absolute;
  top:-4px !important;
  bottom:-4px !important;
  width:5px !important;
  border-radius:4px !important;
  background:var(--tx) !important;
  box-shadow:0 0 0 2.5px #fff,0 1px 6px rgba(16,24,40,.3);
  transition:left .4s cubic-bezier(.34,1.4,.64,1);
  z-index:2
}
.stat-bar .sb-pin:after{
  content:"";
  position:absolute;
  top:-9px !important;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border:5px solid transparent;
  border-top-color:var(--tx);
  border-width:6px !important
}
.stat-bar .sb-labels{
  display:flex;
  justify-content:space-between;
  font-size:11px !important;
  color:var(--tx3);
  font-weight:700;
  margin-top:6px !important;
  padding:0 1px
}
.stat-bar .sb-desc{
  font-size:12px !important;
  color:var(--tx2);
  margin-top:8px !important;
  line-height:1.6;
  background:var(--bg3) !important;
  padding:7px 10px !important;
  border-radius:9px !important
}
.stat-bar.t-low .sb-tag{
  background:var(--red2);
  color:var(--red)
}
.stat-bar.t-ok  .sb-tag{
  background:var(--green2);
  color:var(--green)
}
.stat-bar.t-mid .sb-tag{
  background:var(--amber2);
  color:var(--amber)
}
.stat-bar.t-high .sb-tag{
  background:var(--blue2);
  color:var(--blue)
}
/* 奶量评估 */
.milk-eval{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:14px 15px;
  margin-bottom:12px;
  box-shadow:var(--sd)
}
.milk-eval .me-h{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:8px
}
.milk-eval .me-h .me-t{
  font-size:15px;
  font-weight:800
}
.milk-eval .me-h .me-now{
  margin-left:auto;
  font-size:22px;
  font-weight:900;
  letter-spacing:-.6px
}
.milk-eval .me-h .me-now small{
  font-size:12px;
  color:var(--tx3);
  font-weight:600;
  margin-left:3px
}
.milk-eval .me-bar{
  position:relative;
  height:18px;
  border-radius:9px;
  background:var(--bg3);
  border:1px solid var(--line);
  overflow:hidden
}
.milk-eval .me-zone{
  position:absolute;
  top:0;
  bottom:0;
  background:var(--green2);
  border-left:1px dashed var(--green);
  border-right:1px dashed var(--green)
}
.milk-eval .me-pin{
  position:absolute;
  top:-3px;
  bottom:-3px;
  width:4px;
  border-radius:3px;
  box-shadow:0 0 0 2.5px #fff;
  transition:left .4s;
  z-index:2
}
.milk-eval .me-labels{
  display:flex;
  justify-content:space-between;
  font-size:10.5px;
  color:var(--tx3);
  font-weight:700;
  margin-top:5px
}
.milk-eval .me-tip{
  font-size:12px;
  color:var(--tx3);
  margin-top:8px;
  line-height:1.65;
  background:var(--bg3);
  padding:7px 10px;
  border-radius:9px
}
/* 喂养参考标准 */
.milk-ref{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:4px
}
.milk-ref .mr{
  background:var(--bg3);
  border-radius:10px;
  padding:8px 11px
}
.milk-ref .mr-k{
  font-size:11px;
  color:var(--tx3);
  font-weight:700
}
.milk-ref .mr-v{
  font-size:13.5px;
  font-weight:800;
  color:var(--tx);
  margin-top:1px
}
/* 音乐播放器 */
.music-page{
  padding-bottom:10px
}
.music-note{
  padding:14px 16px;
  background:linear-gradient(120deg,var(--pAccL),color-mix(in srgb,var(--pAccL) 55%,var(--bg2)));
  border-radius:var(--r);
  font-size:12.5px;
  color:var(--tx2);
  line-height:1.7;
  margin-bottom:12px
}
.music-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}
.music-card{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 10px 12px;
  text-align:center;
  cursor:pointer;
  transition:.15s;
  position:relative;
  overflow:hidden;
  box-shadow:var(--sd)
}
.music-card:active{
  transform:scale(.96)
}
.music-card.on{
  border-color:transparent;
  box-shadow:0 0 0 2.5px var(--acc),0 8px 22px color-mix(in srgb,var(--acc) 28%,transparent)
}
.music-card .mc-ic{
  width:46px;
  height:46px;
  border-radius:14px;
  margin:0 auto 9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:#fff !important;
  background:linear-gradient(135deg,var(--acc),var(--acc2)) !important;
  box-shadow:0 6px 14px color-mix(in srgb,var(--acc) 30%,transparent)
}
.music-card.c1 .mc-ic{
  background:linear-gradient(135deg,#63A8D8,#4A93C4)
}
.music-card.c2 .mc-ic{
  background:linear-gradient(135deg,#F5A524,#DB8E12)
}
.music-card.c3 .mc-ic{
  background:linear-gradient(135deg,#14B8A6,#0E9E8E)
}
.music-card.c4 .mc-ic{
  background:linear-gradient(135deg,#43C089,#17855B)
}

    {h:'2025 年重要调整', p:['自 2025-01-01 起，百白破疫苗程序由「3/4/5/18月龄+6岁白破」调整为「2/4/6/18月龄+6周岁百白破」共5剂，进一步加强对小月龄婴儿和学龄儿童的百日咳保护。',
      '脊灰为 2 剂灭活(IPV)+2 剂口服减毒(bOPV)。']},
    {h:'家长怎么做', p:['按本工作台自动排期的月龄带娃接种，带好《预防接种证》。',
      '接种后留观 30 分钟；少数宝宝有低热、局部红肿，通常 1-2 天自行缓解。',
      '生病、发烧或暂缓接种时，康复后尽早补种，不必从头打。']}
  ]},
  nonnip:{ title:'二类疫苗（自费 · 可选）', sub:'非免疫规划，自愿自费，作为一类的重要补充', body:[
    {h:'为什么一类之外还要打', p:['一类覆盖的是最基础、最紧迫的传染病；二类针对肺炎、手足口病、轮状腹泻、流感等高负担疾病，能进一步降低重症和就诊风险。',
      '经济条件允许、或宝宝入托/接触人多时，建议优先选「推荐」类。']},
    {h:'推荐优先打哪些', p:['13价肺炎、五价轮状、Hib、EV71手足口、水痘、流感——这 6 类证据充分、收益明确，多数儿科医生也会建议。',
      '五联/四联属于「替代方案」：少打针少跑腿，但费用更高，按需选择。']},
    {h:'怎么选不纠结', p:['本工作台「疫苗」页可对每类勾选「纳入计划/暂不接种」，勾选后才会进入待办提醒。',
      '拿不准时：先确保一类全打，二类优先 6 类推荐；五联与单苗二选一即可，不必重复。',
      '联合疫苗（五联/四联）与对应一类针次重叠时，把一类重叠针次标记「暂缓」即可。']}
  ]},
  gen:{ title:'什么是免疫规划', sub:'疫苗是最经济有效的传染病预防手段', body:[
    {h:'核心事实', p:['疫苗通过激活自身免疫系统产生保护性抗体，是预防为主、医防协同的具体体现。',
      '我国适龄儿童国家免疫规划疫苗接种率持续保持 90% 以上，多种疫苗针对传染病发病率降至历史最低。',
      '全球已于 1980 年消灭天花，我国持续维持无脊灰状态。']},
    {h:'免费 vs 自费', p:['免费（一类）：政府买单，依法必打。',
      '自费（二类）：自愿选择，作为补充，费用由个人承担。']},
    {h:'温馨提示', p:['本工作台疫苗数据依据《国家免疫规划疫苗儿童免疫程序及说明（2025年版）》。',
      '各地门诊具体品牌/程序可能略有差异，最终以接种门诊安排为准。']}
  ]},
  dev:{ title:'0-3 岁发育里程碑', sub:'依据国家卫健委《婴幼儿早期发展服务指南（试行）》2025', body:[
    {h:'五个能区', p:['大运动（趴、坐、爬、走、跳）、精细动作（抓、捏、翻书、穿扣）、语言（发音、听懂、说话）、认知（寻找、模仿、理解）、社会交往（微笑、认生、互动游戏、自理）。',
      '每个能区按月龄递进发展，可在 3/6/8/12/18/24/30/36 月龄对照自评。']},
    {h:'各月龄标志性表现', p:['3月：竖抱头稳、手握玩具、发声回应、寻声源、对人笑。',
      '6月：独坐片刻、双手传物、叫名转头、找掉落物、分熟人生人。',
      '8月：腹爬、两手对敲、发重复音节、怕生。',
      '12月：独站数秒、小丸放瓶、听懂物品名、模仿动作、读表情。',
      '18月：扶栏上楼、拧瓶盖、说3个词、知物品用途、传球游戏。',
      '24月：双足离地跳、翻书页、说简单句、装扮游戏、示意大小便。',
      '30月：向前跳、画横线、答简单问题、模仿搭积木、懂轮流。',
      '36月：单脚站5秒、穿珠串珠、讲简单故事、理解时间、自己穿鞋袜。']},
    {h:'预警与应对', p:['相应月龄有 1 项标志未出现：加强亲子交流与玩耍促进，并向儿保医生咨询。',
      '有 2 项及以上未出现：带娃到医疗机构做相关评估（如 3月不会抬头、10月不会独坐、18月不会走需排查）。',
      '早产儿用「矫正月龄」评估（矫正月龄=实际月龄-早产月数）。']}
  ]},
  touch:{ title:'婴幼儿抚触（婴儿按摩）', sub:'WHO《儿童早期发展指南》(2019) 推荐，中华儿科医学会推广', body:[
    {h:'有什么好处', p:['促进神经系统发育：触觉刺激激活迷走神经，稳定心率呼吸、降低压力激素。',
      '增强免疫力：规律抚触可减少 6 个月内呼吸道感染风险约 23%。',
      '改善睡眠：规律抚触宝宝平均每天多睡 1-1.5 小时。',
      '促进消化：增强迷走神经兴奋性，胃泌素和胰岛素分泌增加，缓解胀气便秘。',
      '强化亲子依恋：妈妈的声音、目光与抚触建立宝宝的安全感。']},
    {h:'什么时候开始', p:['足月儿：脐带残端脱落（约出生后 1-2 周）、生命体征稳定即可开始。',
      '每天 1-2 次，每次 10-15 分钟；安排在洗澡后、喂奶后 1 小时（避免过饱或饥饿）。']},
    {h:'标准手法', p:['环境：室温 26-28℃、湿度 50-60%，关掉强灯，放轻柔音乐。',
      '操作者：不戴戒指、剪短指甲、洗净双手，涂婴儿润肤油。',
      '顺序：额头中央向两侧轻抚 → 下颌至颈部 → 胸腹（顺时针揉腹缓解胀气）→ 双臂双腿（轻柔按压、螺旋推抹）→ 背部臀部 → 轻捏足底。']},
    {h:'注意 / 禁忌', p:['宝宝哭闹加剧、皮肤发红立即暂停，安抚后再继续；不可强行在睡眠时做。',
      '暂缓/禁忌：皮肤感染（湿疹急性期、脓疱疮）、脐炎未愈、败血症、出血倾向（血小板<50×10⁹/L）、体重<1500g 的早产儿，需医生评估后进行。',
      '1 岁后可升级为「亲子操」，维持至 2 岁后自然过渡。']}
  ]},
  bath:{ title:'洗澡（新生儿）', sub:'WHO 与儿科护理常规做法', body:[
    {h:'时机与频率', p:['脐带残端脱落前做擦浴（不泡澡）；脱落后可盆浴。夏季每天或隔天，冬季 2-3 天一次即可，不必过勤。',
      '选在两次喂奶之间、宝宝清醒安静时洗，避免过饱或饥饿。']},
    {h:'准备', p:['室温 26-28℃，水温 37-38℃（用手腕内侧试温或用水温计，别用手掌，手掌耐烫会误判）。',
      '提前备好浴盆、大毛巾、换洗衣物、护臀膏、棉签；关门避风。']},
    {h:'标准步骤', p:['先洗脸（眼角→鼻→脸，湿纱布轻拭）→ 洗头（手指挡耳，清水冲，囟门处轻揉不用力搓）→ 身体（先胸腹后背，褶皱处洗净）→ 最后臀部。',
      '全程一手托头颈与躯干，脐部未脱落者避水、洗后消毒；洗完 3 分钟内全身涂保湿霜。']},
    {h:'注意 / 禁忌', p:['沐浴露每周 1-2 次足够，平时清水即可；洗后尽快包裹保暖防着凉。',
      '皮肤有破损、接种疫苗当天（针眼处）可擦浴避开；宝宝哭闹剧烈、刚吃完奶不洗。']}
  ]},
  umbilical:{ title:'脐带护理', sub:'保持干燥，自然脱落最关键', body:[
    {h:'原则', p:['保持干燥、清洁、透气，让残端自然脱落（通常出生后 1-3 周，个体差异大）。',
      '脱落前不泡澡，擦浴避开水直接冲脐部。']},
    {h:'做法', p:['每次换尿布后检查；按接种/儿保门诊指导，用 75% 酒精或医用碘伏由内向外环形消毒脐根。',
      '尿布前端翻折露出脐部，避免摩擦与渗液浸泡。']},
    {h:'正常表现', p:['残端由湿软变黑、干瘪、脱落，脱后创面数日愈合；少量清亮或淡血性渗液属正常。']},
    {h:'就医信号', p:['脐周红肿热痛、渗脓性分泌物、有臭味、出血不止、宝宝发热哭闹——警惕脐炎，及时就医。']}
  ]},
  burp:{ title:'拍嗝', sub:'减少胀气和溢奶，喂后必做', body:[
    {h:'为什么拍', p:['喂奶会吞入空气，积聚胃肠致腹胀、溢奶、哭闹；拍嗝帮助排出胃内空气。']},
    {h:'三种姿势', p:['① 竖抱肩头：宝宝趴肩上，空心掌由下往上轻拍背；② 坐腿拍：扶坐大腿，一手托下巴一手拍背；③ 趴膝：俯卧大腿上、头略高，轻拍背部。']},
    {h:'要点', p:['每次喂奶中间及结束后竖抱拍嗝 10-15 分钟；母乳换边时、瓶喂每喝 60-90ml 拍一次；拍不出也竖抱一会儿。',
      '拍嗝后放下时上半身略垫高（垫在床垫下方，不要用枕头垫头），减少溢奶。']}
  ]},
  diaper:{ title:'红屁屁（臀部护理）', sub:'预防胜于治疗', body:[
    {h:'预防为主', p:['勤换：尿湿即换，大便后立即换；保持臀部干爽是核心。']},
    {h:'清洁', p:['温水冲洗或湿巾轻拭，避免用力摩擦；拍干或蘸干，不来回蹭。']},
    {h:'隔离保护', p:['每次换后厚涂含氧化锌的护臀膏，形成保护膜；少用爽身粉（有吸入风险）。']},
    {h:'晾屁屁', p:['每天 15-30 分钟「光屁股」时间（下垫隔尿垫），让皮肤透气。']},
    {h:'就医信号', p:['鲜红边界清楚皮疹伴卫星状小疹（可能念珠菌感染，需抗真菌药膏）、破溃渗液、久不消退。']}
  ]},
  sleep:{ title:'婴儿睡眠安全', sub:'降低婴儿猝死综合征（SIDS）风险', body:[
    {h:'睡姿', p:['1 岁内始终仰卧睡（最防猝死），不俯卧、不侧卧；清醒时可俯卧练抬头。']},
    {h:'同房不同床', p:['婴儿床放父母房间至少前 6 个月（建议 1 年），不与父母同床（防捂被、窒息、坠床）。']},
    {h:'床面安全', p:['床垫硬实、床单服帖；床上不放枕头、被子、毛绒玩具、床围（防闷堵）。穿睡袋代替盖被。']},
    {h:'环境', p:['室温 20-24℃、湿度 50-60%；绝不吸烟环境；不捂热。']},
    {h:'预警', p:['呼吸异常、肤色发青、发热捂热、反应差立即就医。']}
  ]},

  checkup:{ title:'儿保体检都查什么', sub:'依据《国家基本公共卫生服务规范》0-6 岁儿童健康管理', body:[
    {h:'固定节点', p:['新生儿访视、满月、3/6/8/12/18/24/30/36 月龄，以及 4/5/6 周岁。',
      '每次测身长、体重、头围并画生长曲线，评估发育。']},
    {h:'重点内容', p:['6 月龄：血常规（贫血筛查）、听力、辅食指导。',
      '12 月龄：血常规、口腔（出牙）。18 月龄：血常规、语言评估。',
      '24 月龄起：视力初筛。36 月龄起：龋齿检查、入学前体检。']},
    {h:'家长怎么做', p:['在「待办-儿保」点开对应节点可看检查项清单，提前准备。',
      '把体检结果（身高体重头围）录入「健康-生长发育」，自动画 WHO 曲线对照。']}
  ]},
  feed:{ title:'喂养要点速记', sub:'结合中国居民膳食指南（7-24月）与常见儿科建议', body:[
    {h:'0-6 月', p:['母乳是最佳食物，按需喂养；母乳不足或不便时选配方奶。',
      '出生数天后至 2 岁每天补充维生素 D₃ 400IU（遵医嘱）。']},
    {h:'6 月起加辅食', p:['先添富含铁的泥糊状食物（强化铁米粉、肉泥、肝泥），由少到多、由一种到多种。',
      '每次只加一种新食物，观察 2-3 天有无过敏；1 岁内不加盐、糖，不喝蜂蜜。']},
    {h:'7-24 月', p:['逐步过渡到多样化家庭食物，每天保证蛋、肉禽鱼、蔬果；继续母乳或配方奶至 2 岁。',
      '培养自主进食，固定进餐时间，少零食、不喝含糖饮料。']},
    {h:'信号与预警', p:['生长曲线持续低于第 3 百分位或短期大幅波动，建议儿保评估。',
      '严重拒食、体重不增、频繁呕吐需就医。']}
  ]}
};

// ---------- v2.0 新增：百分位扩展（按 Z-score 从 P50 推算 P3/P15/P85/P97） ----------
// 系数：P3≈P50×k3, P15≈P50×k15, P85≈P50×k85, P97≈P50×k97
// 基于 WHO 标准正态近似，Z-score：P3=-1.88, P15=-1.04, P85=1.04, P97=1.88
const GROWTH_REF_5 = (function(){
  const k = {weight:[0.774,0.875,1.125,1.226], height:[0.929,0.961,1.040,1.071], head:[0.947,0.971,1.029,1.053]};
  const r = {male:{}, female:{}};
  for (const sex of ['male','female']){
    for (const metric of ['weight','height','head']){
      r[sex][metric] = GROWTH_REF[sex][metric].map(([m,p50]) => [m, +(p50*k[metric][0]).toFixed(2), +(p50*k[metric][1]).toFixed(2), p50, +(p50*k[metric][2]).toFixed(2), +(p50*k[metric][3]).toFixed(2)]);
    }
  }
  return r;
})();

const LUNAR_GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const LUNAR_ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const LUNAR_ANIMAL=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
const LUNAR_MONTH=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
function lLeapMonth(y){ return LUNAR_INFO[y-1900]&0xf; }
function lLeapDays(y){ return lLeapMonth(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0; }
function lMonthDays(y,m){ return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29; }
function lYearDays(y){
  let sum=348;
  for(let i=0x8000;i>0x8;i>>=1){ if(LUNAR_INFO[y-1900]&i) sum++; }
  return sum+lLeapDays(y);
}
// 公历字符串 YYYY-MM-DD → {y,m,d,leap}；越界或非法返回 null
function solarToLunar(dateStr){
  const dt=parseD(dateStr); if(!dt) return null;
  const y=dt.getFullYear(), m=dt.getMonth()+1, d=dt.getDate();
  if(y<1900||y>2100) return null;
  let offset=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  if(offset<0) return null;
  let i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){ temp=lYearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  const lY=i, leap=lLeapMonth(i);
  let isLeap=false, j;
  for(j=1;j<13&&offset>0;j++){
    if(leap>0&&j===leap+1&&isLeap===false){ --j; isLeap=true; temp=lLeapDays(i); }
    else{ temp=lMonthDays(i,j); }
    if(isLeap===true&&j===leap+1) isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&j===leap+1){
    if(isLeap){ isLeap=false; } else { isLeap=true; --j; }
  }
  if(offset<0){ offset+=temp; --j; }
  return {y:lY,m:j,d:offset+1,leap:isLeap};
}
function lunarDayName(d){
  if(d===10) return '初十';
  if(d===20) return '二十';
  if(d===30) return '三十';
  const n=['一','二','三','四','五','六','七','八','九'];
  return ['初','十','廿','三'][Math.floor(d/10)]+n[(d%10)-1];
}
// 农历展示文案：丙午年六月廿四（闰月加"闰"）；换算失败返回 ''
function lunarText(dateStr){
  const L=solarToLunar(dateStr); if(!L) return '';
  const gz=LUNAR_GAN[(L.y-4)%10]+LUNAR_ZHI[(L.y-4)%12];
  return gz+'年'+(L.leap?'闰':'')+LUNAR_MONTH[L.m-1]+'月'+lunarDayName(L.d);
}
function lunarAnimal(dateStr){
  const L=solarToLunar(dateStr); if(!L) return '';
  return LUNAR_ANIMAL[(L.y-4)%12];
}
function relText(dateStr){
  if(!dateStr) return {t:'待定',c:'t-gray'};
  const n=diffDays(today(),dateStr);
  if(n===0) return {t:'就是今天',c:'t-red'};
  if(n===1) return {t:'明天',c:'t-amber'};
  if(n===2) return {t:'后天',c:'t-amber'};
  if(n<0) return {t:'逾期'+(-n)+'天',c:'t-red'};
  if(n<=7) return {t:n+'天后',c:'t-amber'};
  if(n<=30) return {t:n+'天后',c:'t-blue'};
  return {t:dateStr.slice(5),c:'t-gray'};
}
// 距现在的相对时间（用于"上次喂奶"等需要一眼判断间隔的场景）
function relTime(dateStr,timeStr){
  if(!dateStr) return '暂无';
  const d=parseD(dateStr); if(!d) return '暂无';
  const now=new Date();
  let base=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(timeStr){ const p=String(timeStr).split(':'); if(p.length>=2) base=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1]); }
  if(dateStr!==today()) return relText(dateStr).t;
  const mins=Math.floor((now-base)/60000);
  if(mins<=0) return '刚刚';
  if(mins<60) return mins+'分钟前';
  const h=Math.floor(mins/60), mm=mins%60;
  return h+'小时'+(mm?mm+'分':'')+'前';
}
function toast(msg, opts){

  t.textContent=msg; t.classList.add('on');
  if(typeof opts.onClick==='function'){
    t.onclick = ()=>{ opts.onClick(); t.onclick=null; };
  }
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.classList.remove('on'); t.onclick=null; }, opts.time||2100);
}

}

function merge(remote){
  if(!remote||typeof remote!=='object') return false;
  let changed=false;
  ['baby','settings'].forEach(k=>{
    if(remote[k]&&typeof remote[k]==='object'&&(remote[k].u||0)>(DB[k].u||0)){ DB[k]=remote[k]; changed=true; }
  });
  TABLES.forEach(t=>{
    if(!Array.isArray(remote[t])) return;
    const map={}; (DB[t]||[]).forEach(r=>{ if(r&&r.id) map[r.id]=r; });
    remote[t].forEach(r=>{
      if(!r||!r.id) return;
      const l=map[r.id];
      if(!l){ DB[t].push(r); changed=true; }
      else if((r.u||0)>(l.u||0)){ Object.keys(l).forEach(k=>delete l[k]); Object.assign(l,r); changed=true; }
    });
  });
  return changed;
}

/* ---- 可选端到端加密（AES-GCM，密钥仅存于会话内存，不落地） ---- */
function b64u(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64u(s){ const a=atob(s); const u=new Uint8Array(a.length); for(let i=0;i<a.length;i++) u[i]=a.charCodeAt(i); return u; }
async function deriveKey(pass,salt){
  if(!secureCtx()) throw new Error('当前环境不支持加密（需 https 或 localhost）');
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function askPass(){
  return new Promise(res=>{
    openSheet('输入加密口令',`
      <div class="f"><label>本机与云端都用同一口令加解密</label>
      <input class="inp" id="f_pass" type="password" placeholder="设置或输入口令" autocomplete="off"></div>
      <div class="notice">口令只存在于本次打开的页面内存里，<b>不会上传、也不会存到本地</b>。忘记口令将无法解密云端数据，请务必牢记。</div>`,
      '<button class="btn gray" data-sh="close">取消</button><button class="btn pri" data-sh="save">确定</button>');
    sheetSave=()=>{
      const p=val('f_pass'); if(!p){ toast('请输入口令'); return false; }
      if(!SYNC.salt) SYNC.salt=b64u(crypto.getRandomValues(new Uint8Array(16)));
      deriveKey(p,unb64u(SYNC.salt)).then(k=>{ ENC_KEY=k; SYNC.enc=1; saveSync(); res(true); })
        .catch(e=>{ toast(e.message); res(false); });
      return true;
    };
    sheetClose=()=>{ res(false); };
  });
}
async function encWrap(obj){
  if(!SYNC||!SYNC.enc) return obj;
  if(!ENC_KEY){ const ok=await askPass(); if(!ok) return obj; }
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new TextEncoder().encode(JSON.stringify(obj));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},ENC_KEY,data);
  return { __enc:1, salt:SYNC.salt, iv:b64u(iv), data:b64u(ct) };
}
async function decWrap(obj){
  if(!obj||!obj.__enc) return obj;
  if(!ENC_KEY){ const ok=await askPass(); if(!ok) throw new Error('需要口令'); }
  const iv=unb64u(obj.iv), ct=unb64u(obj.data);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},ENC_KEY,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function pushCloud(){
  if(!SYNC.id) return;
  dot('busy');
  let body;
  try{ body=JSON.stringify(await encWrap(DB)); }catch(e){ dot('err'); toast('加密失败：'+e.message); return; }
  try{
    if(syncBackend()==='gist'){
      const r=await fetch(GIST_API+'/'+SYNC.id,{method:'PATCH',
        headers:{'Authorization':'Bearer '+SYNC.token,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
        body:JSON.stringify({files:{[GIST_FILE]:{content:body}}})});
      if(r.status===404) throw new Error('Gist 未找到：令牌可能缺少 gist 权限，或 Gist 已被手动删除');
      if(r.status===401||r.status===403) throw new Error('GitHub 令牌无效或权限不足（需 gist 权限）');
      if(!r.ok) throw new Error('推送失败 HTTP '+r.status);
    } else {
      const r=await fetch(API_JB+'/'+SYNC.id,{method:'PUT',
        headers:{'Content-Type':'application/json','Accept':'application/json'},body});
      if(r.status===429){ pullGap=Math.min(pullGap*2,120000); dot('err'); return; }
      if(!r.ok) throw new Error('HTTP '+r.status);
    }
    SYNC.last=now(); saveSync(); pullGap=30000; dot('on');
  }catch(e){ dot('err'); if(!/限流/.test(e.message)) toast('同步失败：'+e.message); }
}
async function pullCloud(silent){
  if(!SYNC.id||syncing) return false;
  syncing=true; dot('busy');
  try{
    let remote;
    if(syncBackend()==='gist'){
      const r=await fetch(GIST_API+'/'+SYNC.id,{headers:{'Authorization':'Bearer '+SYNC.token,'Accept':'application/vnd.github+json'}});
      if(r.status===404){ syncing=false; dot('err'); SYNC.id=''; SYNC.url=''; saveSync(); if(!silent) toast('云端同步源已不存在（可能你已在 GitHub 删除），本机数据保留 ✓'); render(); return false; }
      if(r.status===401||r.status===403) throw new Error('GitHub 令牌无效');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const g=await r.json();
      const content=g.files&&g.files[GIST_FILE]&&g.files[GIST_FILE].content;
      if(!content) throw new Error('云端文件为空');
      remote=await decWrap(JSON.parse(content));
    } else {
      const r=await fetch(API_JB+'/'+SYNC.id,{headers:{'Accept':'application/json'}});
      if(r.status===429){ pullGap=Math.min(pullGap*2,120000); throw new Error('限流'); }
      if(!r.ok) throw new Error('HTTP '+r.status);
      remote=await decWrap(await r.json());
    }
    const changed=merge(remote);
    try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){}
    SYNC.last=now(); saveSync(); pullGap=30000; dot('on');
    if(changed){ render(); if(!silent) toast('已同步云端最新数据'); }
    else if(!silent) toast('已是最新 ✓');
    syncing=false; return true;
  }catch(e){
    dot('err'); syncing=false;
    if(/限流/.test(e.message)){ if(!silent) toast('同步服务繁忙，稍后自动重试'); }
    else if(!silent) toast('同步失败：'+e.message);
    return false;
  }
}
async function createCloud(retry){
  retry=retry||0; dot('busy');
  try{
    let body=JSON.stringify(await encWrap(DB));
    if(syncBackend()==='gist'){
      const r=await fetch(GIST_API,{method:'POST',
        headers:{'Authorization':'Bearer '+SYNC.token,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
        body:JSON.stringify({public:false,files:{[GIST_FILE]:{content:body}}})});
      if(r.status===404) throw new Error('令牌没有 gist 权限：请去 GitHub → Settings → Developer settings → Tokens → 编辑令牌 → 勾选 gist → 重新生成（旧令牌会失效，新令牌需重新填入）');
      if(r.status===401||r.status===403) throw new Error('GitHub 令牌无效或权限不足（需 gist 权限）');
      if(!r.ok) throw new Error('创建失败 HTTP '+r.status);
      const g=await r.json();
      SYNC.id=g.id; SYNC.url=g.html_url; SYNC.last=now(); saveSync(); dot('on');
      return g.id;
    }
    const r=await fetch(API_JB,{method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},body});
    if(r.status===429){
      if(retry<4){ if(retry===0) toast('同步服务繁忙，正在重试…'); await sleep(2000*(retry+1)); return createCloud(retry+1); }
      toast('同步服务暂忙，已转后台每 60 秒自动重试（本地记录正常保存，不影响使用）');
      scheduleCreateRetry(); return null;
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const loc=r.headers.get('Location')||r.headers.get('location');
    let id=r.headers.get('X-jsonblob')||r.headers.get('x-jsonblob');
    if(!id&&loc) id=String(loc).split('/').pop();
    if(!id) throw new Error('未取得同步码');
    SYNC.id=id; SYNC.url='https://jsonblob.com/'+id; SYNC.last=now(); saveSync(); dot('on');
    return id;
  }catch(e){ dot('err'); toast('创建失败：'+e.message); return null; }
}
function scheduleCreateRetry(){
  if(SYNC&&SYNC.id) return;
  setTimeout(()=>{
    if(SYNC&&SYNC.id) return;
    createCloud().then(id=>{ if(id){ pushCloud(); render(); showSyncCode(); toast('云同步已开启 ✓'); } });
    scheduleCreateRetry();
  }, 60000);
}
function schedulePull(){
  clearTimeout(pullTimer2);
  pullTimer2=setTimeout(()=>{
    if(SYNC&&SYNC.id&&!syncing) pullCloud(true);
    schedulePull();
  }, pullGap);
}

function seed(force){
  const b=DB.baby; if(!b.birth) return 0;
  const exist={}, byName={};
  TABLES.forEach(t=>{ (DB[t]||[]).forEach(r=>{ if(r&&r.k){ exist[t+'|'+r.k]=r; if(r.name!==undefined&&r.m!==undefined) byName[t+'|'+(r.type||'')+':'+r.m+':'+r.name]=r; } }); });
  let n=0;
  const list=VACCINE_NIP.map(v=>Object.assign({},v,{type:'一类'}))
    .concat(DB.settings.showNonNip?VACCINE_NON_NIP.map(v=>Object.assign({},v,{type:'二类'})):[]);
  const cnt={};
  list.forEach(v=>{
    const P=VAX_PRODUCTS[v.vax]||{};
    cnt[v.vax]=(cnt[v.vax]||0)+1;
    const dose=cnt[v.vax];
    const doseName=P.name+(dose>1?' 第'+dose+'剂':'');
    const k='vac:'+v.type+':'+v.m+':'+v.vax;            // 稳定主键：类型+月龄+产品
    const plan=addMonths(b.birth,v.m);
    const old=exist['vaccines|'+k];
    if(old){
      if(old.del){ delete old.del; old.u=now(); n++; }              // 复活被移除的记录
      if(force&&old.status!=='已完成'&&old.planDate!==plan){ old.planDate=plan; old.u=now(); }
      // 字段补全（兼容 v1.6 前缺字段的老记录）
      if(old.vax===undefined){ old.vax=v.vax; old.vaxName=P.name; old.pay=P.pay||'免费'; old.rec=P.rec||'必打'; old.intro=P.intro||''; }
      if(old.name===undefined||old.name===null||old.name==='') old.name=doseName;
      if(old.plan===undefined) old.plan=(v.type==='一类'?1:(P.rec==='推荐'?1:0));
      old.u=now();
      return;
    }
    DB.vaccines.push({id:uid(),k:k,name:doseName,type:v.type,m:v.m,vax:v.vax,vaxName:P.name,
      pay:P.pay||'免费',rec:P.rec||'必打',intro:P.intro||'',plan:(v.type==='一类'?1:(P.rec==='推荐'?1:0)),
      planDate:plan,actualDate:'',status:'待接种',reaction:'',note:v.note,u:now()});
    n++;
  });
  CHECKUP_PLAN.forEach(c=>{
    const k='chk:'+c.m;
    const plan=c.m===0?addDays(b.birth,5):addMonths(b.birth,c.m);
    const old=exist['checkups|'+k];
    if(old){
      if(old.del){ delete old.del; old.u=now(); n++; }
      if(force&&old.status!=='已完成'&&old.planDate!==plan){ old.planDate=plan; old.u=now(); }
      return;
    }
    DB.checkups.push({id:uid(),k:k,label:c.label,m:c.m,item:c.item,planDate:plan,actualDate:'',
      height:'',weight:'',head:'',advice:'',abnormal:'',status:'待完成',u:now()});
    n++;
  });
  DEV_TASKS.forEach((d,i)=>{
    const k='dev:'+i; const old=exist['devtasks|'+k];
    if(old){ if(old.del){ delete old.del; old.u=now(); n++; } if(old.rec===undefined){ old.rec=d[4]||7; old.u=now(); } return; }
    DB.devtasks.push({id:uid(),k:k,mFrom:d[0],mTo:d[1],cat:d[2],content:d[3],rec:d[4]||7,done:0,doneDate:'',u:now()});
    n++;
  });
  CARE_TASKS.forEach((c,i)=>{
    const k='care:'+i; const old=exist['caretasks|'+k];
    if(old){ if(old.del){ delete old.del; old.u=now(); n++; } return; }
    DB.caretasks.push({id:uid(),k:k,name:c.name,cycle:c.cycle,owner:c.owner,note:c.note,lastDone:'',u:now()});
    n++;
  });
  if(n) save();
  return n;
}

/* ---------- v1.5 -> v1.6 疫苗数据迁移（一次性） ----------
   v1.5 记录无 vax 字段、剂次名为“乙肝疫苗 第1剂”这类描述名；
   本函数按名称前缀映射到 v1.6 产品，迁移后清掉老记录、重新排期，
   并把已完成的接种状态（含实际日期/反应）按 类型|月龄|产品 回填，避免重复与孤儿记录。 */
const LEGACY_VAX={
  '乙肝疫苗':'hepB','卡介苗':'bcg','脊灰灭活疫苗IPV':'ipv','脊灰减毒活疫苗bOPV':'bopv',
  '百白破疫苗':'dtap','白破疫苗DT':'dtap','A群流脑多糖疫苗':'mA','麻腮风疫苗MMR':'mmr',
  '乙脑减毒活疫苗':'je','甲肝减毒活疫苗':'hepA','A群C群流脑多糖疫苗':'mAC',
  '13价肺炎结合疫苗':'pcv13','五价轮状病毒疫苗':'rotarix','Hib流感嗜血杆菌疫苗':'hib',
  'EV71手足口疫苗':'ev71','流感疫苗':'flu','水痘疫苗':'varicella'
};
function migrateVaccines(){
  if(!DB.baby.birth) return;
  const legacy=DB.vaccines.filter(v=>v.vax===undefined);
  if(!legacy.length) return;
  const done={};   // 类型|月龄|产品 -> 已完成信息
  legacy.forEach(v=>{
    let vax=null;
    for(const p in LEGACY_VAX){ if((v.name||'').indexOf(p)===0){ vax=LEGACY_VAX[p]; break; } }
    if(!vax) return;
    const key=(v.type||'')+'|'+v.m+'|'+vax;
    if(v.status==='已完成') done[key]={status:v.status,actualDate:v.actualDate||'',reaction:v.reaction||'',note:v.note||''};
  });
  DB.vaccines=DB.vaccines.filter(v=>v.vax!==undefined);   // 丢弃老结构孤儿记录
  seed(false);
  DB.vaccines.forEach(v=>{ const key=v.type+'|'+v.m+'|'+v.vax; if(done[key]){ Object.assign(v,done[key]); v.u=now(); } });
  save();
}

const CYCLE_DAYS={'每日':1,'每周':7,'每两周':14,'每月':30,'每季度':90,'仅一次':0};
function careNext(c){
  if(!c) return null;
  const d=CYCLE_DAYS[c.cycle];
  if(d===0) return c.lastDone?null:today();
  if(!c.lastDone) return today();
  return addDays(c.lastDone,d===undefined?7:d);
}
function allTodos(){
  const out=[];
  rows('vaccines').forEach(v=>{ if(v.status==='待接种'&&v.planDate&&v.plan!==0)
    out.push({kind:'vaccine',id:v.id,date:v.planDate,title:v.name,sub:v.type+'类疫苗 · '+(v.note||''),icon:'vaccine',ic:'ic-pink'}); });
  rows('checkups').forEach(c=>{ if(c.status!=='已完成'&&c.planDate)
    out.push({kind:'checkup',id:c.id,date:c.planDate,title:c.label,sub:c.item||'',icon:'hospital',ic:'ic-blue'}); });
  rows('caretasks').forEach(c=>{ const d=careNext(c); if(d)
    out.push({kind:'care',id:c.id,date:d,title:c.name,sub:c.cycle+' · '+c.owner,icon:'care',ic:'ic-green'}); });
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return out;
}
function todosWithin(days){
  const lim=addDays(today(),days);

}
function curDevTasks(){

/* 发育打卡：按推荐次数 / 时间间隔持续记录（不再“打一次就完”） */
function weekStart(dateStr){
  const d=parseD(dateStr||today()); if(!d) return today();
  const day=(d.getDay()+6)%7;            // 周一为一周起点
  return addDays(fmt(d),-day);
}
function devWeek(k){                        // 本周打卡次数
  const ws=weekStart();
  return rows('devlogs').filter(l=>l&&l.k===k&&l.date>=ws).length;
}
function devLast(k){                        // 最近一次打卡日期
  const a=rows('devlogs').filter(l=>l&&l.k===k).map(l=>l.date).sort();
  return a.length?a[a.length-1]:'';
}
function devStreak(k){                       // 连续打卡天数（截止到最近一次）
  const dates=rows('devlogs').filter(l=>l&&l.k===k).map(l=>l.date).sort().reverse();
  if(!dates.length) return 0;
  let streak=1, cur=dates[0];
  for(let i=1;i<dates.length;i++){
    if(diffDays(dates[i],cur)===1){ streak++; cur=dates[i]; }
    else if(diffDays(dates[i],cur)===0){ /* 同一天多次，不计 */ }
    else break;
  }
  return streak;
}
function devDone(k){ const t=get('devtasks',k); return t&&t.done?1:0; }
function devToday(k){                         // 今天是否已打卡
  return rows('devlogs').some(l=>l&&l.k===k&&l.date===today());
}
function devTotal(k){                         // 累计打卡次数
  return rows('devlogs').filter(l=>l&&l.k===k).length;
}
// 待办里程碑 / 完成事件 自动联动成长足迹（时光轴）：用 src 去重，切换回非完成态则移除联动记录
function autoMoment(src, text, tags){
  if(rows('moments').some(x=>x.src===src)) return;       // 已记录则不重复
  put('moments',{id:uid(),date:today(),monthAge:monthAge(DB.baby.birth),tags:(tags||[]),text:text,src:src});
}
function unlinkMoment(src){
  rows('moments').filter(x=>x.src===src).forEach(x=>del('moments',x.id));
}
function devWeekDays(ids){                     // 本周去重打卡天数（跨任务汇总，避免同日多任务被重复计数）
  const ws=weekStart(); const set=new Set();
  rows('devlogs').forEach(l=>{ if(l&&ids.indexOf(l.k)>=0&&l.date>=ws) set.add(l.date); });
  return set.size;
}

/* ========== 生长参考 ========== */
function refAt(metric,m){
  const g=DB.baby.gender==='female'?'female':'male';
  const arr=(GROWTH_REF[g]||{})[metric]; if(!arr||!arr.length) return null;
  if(m<=arr[0][0]) return arr[0][1];
  if(m>=arr[arr.length-1][0]) return arr[arr.length-1][1];
  for(let i=0;i<arr.length-1;i++){
    if(m>=arr[i][0]&&m<=arr[i+1][0]){
      const r=(m-arr[i][0])/(arr[i+1][0]-arr[i][0]);
      return arr[i][1]+(arr[i+1][1]-arr[i][1])*r;
    }
  }
  return null;
}
function evalGrowth(m,metric,val){
  const p50=refAt(metric,m);
  if(!p50||!val||isNaN(val)) return '';
  const sd=p50*GROWTH_SD[metric];
  const z=(val-p50)/sd;
  if(z<-1.88) return '偏低（低于参考下限，建议咨询医生）';
  if(z<-1) return '偏下水平';
  if(z<=1) return '中等水平（良好）';
  if(z<=1.88) return '偏上水平';
  return '偏高（位于同龄宝宝上游水平，可咨询医生生长曲线）';
}

/* ========== v2.0 数据评估（5档百分位 + 奶量） ========== */
function evalGrowth5(metric,m,val){
  if(!val||isNaN(val)) return null;
  const sex=(DB.baby.gender==='female')?'female':'male';
  const arr=GROWTH_REF_5[sex][metric];
  let i=0;
  for(;i<arr.length-1;i++) if(m<arr[i+1][0]) break;
  if(i>=arr.length-1) i=arr.length-2;
  if(m<arr[0][0]) i=0;
  const t=(m-arr[i][0])/(arr[i+1][0]-arr[i][0]);
  const lerp=(a,b)=>a+(b-a)*t;
  const p3=+lerp(arr[i][1],arr[i+1][1]).toFixed(2);
  const p15=+lerp(arr[i][2],arr[i+1][2]).toFixed(2);
  const p50=+lerp(arr[i][3],arr[i+1][3]).toFixed(2);
  const p85=+lerp(arr[i][4],arr[i+1][4]).toFixed(2);
  const p97=+lerp(arr[i][5],arr[i+1][5]).toFixed(2);
  // 计算百分位（基于 Z-score）
  const sd=p50*GROWTH_SD[metric];
  const z=(val-p50)/sd;
  let level,label,tagClass;
  if(z<-1.88){level='偏低';label='低于同龄常见范围，儿保时可咨询医生';tagClass='t-blue';}
  else if(z<-1.04){level='偏下';label='略低于常见区间，持续观察即可';tagClass='t-blue';}
  else if(z<0){level='中等偏下';label='处于常见范围的偏低侧';tagClass='t-gray';}
  else if(z<=1){level='中等偏上';label='处于常见范围，发育良好';tagClass='t-ok';}
  else if(z<=1.88){level='偏上';label='略高于常见区间，属正常波动';tagClass='t-amber';}
  else{level='偏高';label='位于同龄宝宝上游水平，儿保时可咨询医生生长曲线';tagClass='t-amber';}
  // 当前值在 P3~P97 参考区间上的位置百分比（用于可视化定位）
  const pinPct=Math.min(100,Math.max(0,(val-p3)/(p97-p3)*100));
  return {p3,p15,p50,p85,p97,val,level,label,tagClass,min:p3,max:p97,pinPct};
}
function evalMilk(ageM,todayMl){
  if(!todayMl||isNaN(todayMl)||todayMl<=0) return null;
  const m=Math.max(1,Math.min(36,ageM||1));
  const ref=MILK_REF[m]||MILK_REF[1];
  // 解析区间
  const parseRange=s=>{const p=String(s).match(/(\d+)-(\d+)/);return p?[+p[1],+p[2]]:null;};
  const range=parseRange(ref.daily);
  if(!range) return null;
  const [lo,hi]=range;
  let level,tip,tagClass,zoneColor='var(--green)',pinColor='var(--green)';
  if(todayMl<lo*0.7){level='严重不足';tip='奶量明显低于下限，建议增加喂养次数或咨询医生';tagClass='t-low';zoneColor='var(--red)';pinColor='var(--red)';}
  else if(todayMl<lo){level='略少';tip='略低于参考下限，可适当增加喂养量';tagClass='t-mid';zoneColor='var(--amber)';pinColor='var(--amber)';}
  else if(todayMl<=hi){level='正常';tip='在参考范围内，继续保持';tagClass='t-ok';}
  else if(todayMl<=hi*1.2){level='略多';tip='略高于参考上限，留意是否过度喂养';tagClass='t-mid';zoneColor='var(--amber)';pinColor='var(--amber)';}
  else{level='过多';tip='奶量明显高于参考上限，留意是否测量误差或过度喂养';tagClass='t-low';zoneColor='var(--red)';pinColor='var(--red)';}
  // 定位点位置（参考区间整体作为 0-100%，映射到 0-100% 横轴）
  const maxV=hi*1.3; // 图表最大范围
  const pinPct=Math.min(100,Math.max(0,todayMl/maxV*100));
  const loPct=lo/maxV*100, hiPct=hi/maxV*100;
  return {ref,val:todayMl,lo,hi,level,tip,tagClass,pinPct,loPct,hiPct,maxV,zoneColor,pinColor};
}

/* ========== v2.0 安抚音乐播放器（Web Audio API 实时合成） ========== */
const Music = {
  ctx:null, current:null, gain:null,
  ensure(){
    if(!this.ctx){
      try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.gain=this.ctx.createGain(); this.gain.gain.value=0.45; this.gain.connect(this.ctx.destination); }
      catch(e){ toast('当前环境不支持音频播放'); return false; }
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return true;
  },
  stop(){ if(this.current){ try{ this.current.stop(); }catch(e){} this.current=null; } },
  // 6 种声音：white/pink/heart/womb/lullaby/wave
  play(kind){
    if(!this.ensure()) return;
    this.stop();
    const c=this.ctx, g=this.gain;
    const t=c.currentTime;
    if(kind==='white'){
      // 白噪音：随机白噪声
      const buf=c.createBuffer(1, c.sampleRate*2, c.sampleRate);
      const ch=buf.getChannelData(0);
      for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
      const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=8000;
      src.connect(f); f.connect(g); src.start(t); this.current=src;
    } else if(kind==='pink'){
      // 粉噪音：低频为主的噪声
      const buf=c.createBuffer(1, c.sampleRate*2, c.sampleRate);
      const ch=buf.getChannelData(0);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<ch.length;i++){
        const w=Math.random()*2-1; b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759;
        b2=.96900*b2+w*.1538520; b3=.86650*b3+w*.3104856; b4=.55000*b4+w*.5329522;
        b5=-.7616*b5-w*.0168980; ch[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926;
      }
      const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
      src.connect(g); src.start(t); this.current=src;
    } else if(kind==='heart'){
      // 心跳声：双脉冲节奏（约 70bpm ≈ 0.86s/次）
      const osc1=c.createOscillator(); osc1.type='sine'; osc1.frequency.value=70;
      const osc2=c.createOscillator(); osc2.type='sine'; osc2.frequency.value=50;
      const subGain=c.createGain();
      subGain.gain.setValueAtTime(0,t);
      const beat=0.86;
      for(let i=0;i<40;i++){
        const t0=t+i*beat;
        subGain.gain.setValueAtTime(0,t0);
        subGain.gain.linearRampToValueAtTime(0.7,t0+0.04);
        subGain.gain.exponentialRampToValueAtTime(0.001,t0+0.18);
        subGain.gain.setValueAtTime(0,t0+0.22);
        subGain.gain.linearRampToValueAtTime(0.5,t0+0.25);
        subGain.gain.exponentialRampToValueAtTime(0.001,t0+0.4);
      }
      osc1.connect(subGain); osc2.connect(subGain); subGain.connect(g);
      osc1.start(t); osc2.start(t);
      osc1.stop(t+40*beat); osc2.stop(t+40*beat);
      this.current={stop(){try{osc1.stop();osc2.stop();}catch(e){}}};
    } else if(kind==='womb'){
      // 子宫环境：低频嗡嗡 + 心跳 + 呼吸感
      const subGain=c.createGain(); subGain.gain.value=0.4;
      const osc=c.createOscillator(); osc.type='sine'; osc.frequency.value=60;
      osc.connect(subGain); subGain.connect(g); osc.start(t);
      // 叠加心跳
      const heartOsc=c.createOscillator(); heartOsc.type='sine'; heartOsc.frequency.value=80;
      const heartGain=c.createGain(); heartGain.gain.value=0.3;
      heartOsc.connect(heartGain); heartGain.connect(g); heartOsc.start(t);
      // 呼吸感 LFO
      const lfo=c.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.25; // 4s 一次
      const lfoGain=c.createGain(); lfoGain.gain.value=0.15;
      lfo.connect(lfoGain); lfoGain.connect(subGain.gain); lfo.start(t);
      osc.stop(t+45); heartOsc.stop(t+45); lfo.stop(t+45);
      this.current={stop(){try{osc.stop();heartOsc.stop();lfo.stop();}catch(e){}}};
    } else if(kind==='lullaby'){
      // 摇篮曲：C 大调五声音阶循环（C D E G A）
      const notes=[261.63,293.66,329.63,392.00,440.00,392.00,329.63,293.66];
      const noteDur=0.55;
      const masterGain=c.createGain(); masterGain.gain.value=0.4;
      masterGain.connect(g);
      for(let i=0;i<64;i++){
        const t0=t+i*noteDur;
        const osc=c.createOscillator(); osc.type='triangle'; osc.frequency.value=notes[i%notes.length];
        const env=c.createGain(); env.gain.setValueAtTime(0,t0);
        env.gain.linearRampToValueAtTime(0.5,t0+0.05);
        env.gain.exponentialRampToValueAtTime(0.001,t0+noteDur*0.9);
        osc.connect(env); env.connect(masterGain);
        osc.start(t0); osc.stop(t0+noteDur);
      }
      this.current={stop:()=>{try{masterGain.disconnect();}catch(e){}}};
    } else if(kind==='wave'){
      // 海浪声：粉噪音 + LFO 模拟潮起潮落
      const buf=c.createBuffer(1, c.sampleRate*3, c.sampleRate);
      const ch=buf.getChannelData(0);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<ch.length;i++){
        const w=Math.random()*2-1; b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759;
        b2=.96900*b2+w*.1538520; b3=.86650*b3+w*.3104856; b4=.55000*b4+w*.5329522;
        b5=-.7616*b5-w*.0168980; ch[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926;
      }
      const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=500; f.Q.value=0.6;
      const lfo=c.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.12; // 8s 一次
      const lfoGain=c.createGain(); lfoGain.gain.value=0.4;
      lfo.connect(lfoGain); lfoGain.connect(g.gain);
      src.connect(f); f.connect(g); src.start(t); lfo.start(t);
      src.stop(t+45); lfo.stop(t+45);
      this.current={stop(){try{src.stop();lfo.stop();}catch(e){}}};
    }
  }
};

    <div class="grp">快速记录</div>

    <button class="nv" data-fab="growth"><span class="nvi">${ICON('growth')}</span>记生长数据</button>
    <button class="nv" data-fab="daily"><span class="nvi">${ICON('feed')}</span>记喂养作息</button>

/* 重要事件提醒：仅聚合「疫苗 / 儿保」中临近(7天内)或已逾期项，与待办相互独立 */
function collectImportantEvents(){
  const evs=[];
  rows('vaccines').forEach(v=>{
    if(v.status==='待接种'&&v.planDate&&v.plan!==0){
      const d=diffDays(today(),v.planDate);          // d = 计划日期 - 今天；d<0 表示已逾期
      if(d>=-30 && d<=7) evs.push({date:v.planDate,kind:'vaccine',id:v.id,title:v.name,sub:v.type+'疫苗',over:d<0,days:d});
    }
  });
  rows('checkups').forEach(c=>{
    if(c.status!=='已完成'&&c.planDate){
      const d=diffDays(today(),c.planDate);
      if(d>=-30 && d<=7) evs.push({date:c.planDate,kind:'checkup',id:c.id,title:c.label,sub:c.item||'',over:d<0,days:d});
    }
  });
  // 排序：逾期优先（按逾期天数少的排前面），然后临近（按天数近的排前面）
  evs.sort((a,b)=>{
    if(a.over!==b.over) return a.over?-1:1;
    return (a.days||0)-(b.days||0);
  });
  return evs;
}
function importantEventsHTML(){
  const evs=collectImportantEvents();
  if(!evs.length) return '';
  return `<div class="sec-t"><span class="sti">${ICON('bell')}</span>重要事件提醒<span class="more" data-nav="important">全部 ›</span></div>
  <div class="card pad0">${evs.slice(0,3).map(e=>{
    const inner=`<div class="item">
      <div class="ic ${e.kind==='vaccine'?'ic-pink':'ic-blue'}">${e.kind==='vaccine'?ICON('vaccine'):ICON('hospital')}</div>
      <div class="bd"><div class="t1">${esc(e.title)}</div><div class="t2">${esc(e.sub||'')}</div></div>
      <span class="rt tag ${e.over?'t-red':'t-amber'}">${e.over?('逾期 '+Math.abs(e.days)+'天'):relText(e.date).t}</span>
    </div>`;
    return swipeRow(e.kind,e.id,inner);
  }).join('')}</div>`;
}
