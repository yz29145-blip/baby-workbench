// 科普查看：data-info="vax:KEY" 看单支疫苗；data-info="nip/nonnip/gen/dev/touch/checkup/feed" 看大类；data-info="todo-xxx/timeline-xxx/health-xxx/today-xxx" 看页面说明
function openInfo(key){
  let title, body, actions;
  if(key.indexOf('vax:')===0){
    const vk=key.slice(4), P=VAX_PRODUCTS[vk]; if(!P) return;
    title=P.name+'（'+P.pay+' · '+P.rec+'）';
    const ds=rows('vaccines').filter(v=>v.vax===vk).map(v=>v.m).sort((a,b)=>a-b);
    body=[{h:'疫苗简介',p:[P.intro]},{h:'本剂说明',p:[P.note]},
      {h:'建议接种月龄',p:[ds.length?ds.map(m=>m+'月').join('、'):'—']}];
  } else if(PAGE_TIPS[key]){
    const P=PAGE_TIPS[key];
    title=P.title; body=P.body; actions=P.actions;
  } else {
    const G=GUIDES[key]; if(!G) return;
    title=G.title; body=G.body;
  }
  let html=body.map(b=>`<h3>${esc(b.h)}</h3>${b.p.map(p=>`<p>${esc(p)}</p>`).join('')}`).join('');
  if(actions&&actions.length){
    const acts=actions.map(a=>{
      if(a.type==='info') return `<span class="pill" data-info="${esc(a.key)}">${esc(a.text)}</span>`;
      return `<span class="pill" data-act="${esc(a.key)}">${esc(a.text)}</span>`;
    }).join('');
    html+=`<div class="info-actions"><div class="ia-tit">相关操作与说明</div>${acts}</div>`;
  }
  if(key==='timeline-album'){
    const albums=DB.settings.albums||[];
    if(albums.length){
      const links=albums.map(a=>`<a class="pill" href="${esc(a.url)}" target="_blank" rel="noopener" data-stop="1">${esc(a.name)}</a>`).join('');
      html+=`<div class="info-actions"><div class="ia-tit">常用相册</div>${links}</div>`;
    }
  }
  openSheet(title, `<div class="doc">${html}</div>`, '<button class="btn gray" data-sh="close">知道了</button>');
}

/* ---------- 待办 ---------- */
function todoHTML(){
  const s=SUB.todo;
  const segs=[['vaccine','疫苗'],['checkup','儿保'],['dev','发育任务'],['care','护理分工']];
  const mk=(k)=>{
    let body='';
    if(k==='vaccine'){
    const list=rows('vaccines').slice().sort((a,b)=>(a.planDate||'')<(b.planDate||'')?-1:1);
    const done=list.filter(v=>v.status==='已完成').length;
    const groups={};
    list.forEach(v=>{ (groups[v.vax]=groups[v.vax]||[]).push(v); });
    const gkeys=Object.keys(groups).sort((a,b)=>{
      const A=VAX_PRODUCTS[a]||{}, B=VAX_PRODUCTS[b]||{};
      if((A.cat==='一类')!==(B.cat==='一类')) return A.cat==='一类'?-1:1;
      return (groups[a][0].m||0)-(groups[b][0].m||0);
    });
    const vaxCard=(key)=>{
      const g=groups[key], P=VAX_PRODUCTS[key]||{};
      const plan=g[0].plan;
      const ds=g.slice().sort((a,b)=>a.m-b.m).map(v=>{
        const d=relText(v.planDate), done2=v.status==='已完成';
        return `<div class="vd ${done2?'done':''}" data-open="vaccine:${esc(v.id)}">
          <div class="ck ${done2?'done':''}" data-quick="vaccine:${esc(v.id)}">${done2?'✓':''}</div>
          <div class="bd"><div class="t1 ${done2?'done':''}">${esc(v.name)}</div>
          <div class="t2">计划 ${esc(v.planDate)}${v.actualDate?' · 实际 '+esc(v.actualDate):''}${v.reaction?' · <span style="color:var(--red)">有反应</span>':''}</div></div>
          <span class="rt tag ${done2?'t-green':d.c}">${done2?'已完成':d.t}</span>
        </div>`;
      }).join('');
      return `<div class="vax ${plan?'':'off'}">
        <div class="vax-h">
          <div class="vax-t"><div class="t1">${esc(P.name||key)}</div>
            <div class="t2"><span class="tag ${P.pay==='免费'?'t-green':'t-purple'}">${esc(P.pay||'')}</span>
            <span class="tag ${P.rec==='必打'?'t-red':P.rec==='推荐'?'t-amber':'t-gray'}">${esc(P.rec||'')}</span></div></div>
          <div class="vax-a">
            <button class="pill g-ghost" data-info="vax:${esc(key)}">疫苗介绍</button>
            <span class="pill ${plan?'on':''}" data-act="setVaxPlan:${esc(key)}:${plan?0:1}">${plan?'纳入计划':'暂不接种'}</span>
          </div>
        </div>
        <div class="vax-d">${ds}</div>
      </div>`;
    };
    body=infoLineHTML('todo-vaccine','国家免疫规划自动排期，已打 '+done+' 剂')
      +`<div class="card pad0">${gkeys.length?gkeys.map(vaxCard).join(''):'<div class="empty">请先填写宝宝出生日期</div>'}</div>`;
  }
  else if(k==='checkup'){
    const list=rows('checkups').slice().sort((a,b)=>(a.planDate||'')<(b.planDate||'')?-1:1);
    body=infoLineHTML('todo-checkup','按国家规范自动排期，就诊前可查看检查项')
      +`<div class="card pad0">${list.length?list.map(c=>{
        const r=relText(c.planDate), d=c.status==='已完成';
        return `<div class="item" data-open="checkup:${esc(c.id)}">
        <div class="ck ${d?'done':''}" data-quick="checkup:${esc(c.id)}">${d?'✓':''}</div>
        <div class="bd"><div class="t1 ${d?'done':''}">${esc(c.label)}</div>
        <div class="t2">计划 ${esc(c.planDate)}${d&&c.height?' · '+esc(c.height)+'cm / '+esc(c.weight)+'kg':''}${c.abnormal?' · <span style="color:var(--red);font-weight:700">有异常</span>':''}</div></div>
        <span class="rt tag ${d?'t-green':r.c}">${d?'已完成':r.t}</span>
      </div>`}).join(''):'<div class="empty">请先填写宝宝出生日期</div>'}</div>`;
  }
  else if(k==='dev'){
    const m=monthAge(DB.baby.birth);
    const list=rows('devtasks').slice().sort((a,b)=>a.mFrom-b.mFrom);
    const cur=list.filter(d=>m>=d.mFrom&&m<d.mTo);
    const next=list.filter(d=>d.mFrom>=m&&d.mFrom<m+4&&!(m>=d.mFrom&&m<d.mTo));
    const past=list.filter(d=>d.mTo<=m&&!d.done);
    const doneCnt=cur.filter(d=>d.done).length;
    // 本周练习次数 = 当前月龄各项能力本周打卡次数之和。
    // （旧实现用 devWeekDays 跨任务按“日期”去重，分子是天数、分母是次数，量纲不一致，
    //   导致同一天打卡多项能力也只显示 1，与实际打卡次数对不上。）
    const wkTotal=cur.reduce((s,d)=>s+devWeek(d.id),0);
    const recTotal=cur.reduce((s,d)=>s+(d.rec||7),0);
    const wkDays=devWeekDays(cur.map(d=>d.id));   // 本周有练习的天数（另行展示，不参与上面的次数口径）
    const card=(arr,t)=>arr.length?`<div class="sec-t">${t}</div><div class="card pad0">${arr.map(d=>{
      const wk=devWeek(d.id), rec=d.rec||7, st=devStreak(d.id), todayDone=devToday(d.id), total=devTotal(d.id);
      return `<div class="item dev">
        <button class="ck ck-dev ${todayDone?'on':''}" data-quick="devlog:${esc(d.id)}" title="${todayDone?'今日已练，点击取消':'今日未练，点击打卡'}"><span class="ck-ic">✓</span></button>
        <div class="bd"><div class="t1 ${d.done?'done':''}" style="font-size:14px">${esc(d.content)}</div>
          <div class="t2"><span class="tag ${catTag(d.cat)}">${esc(d.cat)}</span><span class="tag t-gray">适应 ${d.mFrom}-${d.mTo}月</span></div>
          <div class="t2 dev-stat"><span class="tag ${wk>=rec?'t-green':'t-cyan'}">本周 ${wk}/${rec} 次</span>${st>1?`<span class="tag t-amber">连续 ${st} 天</span>`:''}${total?`<span class="dev-total">累计 ${total} 次</span>`:''}</div></div>
        <div class="dev-right"><button class="mini ${d.done?'ms-badge':'ms-btn'}" data-quick="devdone:${esc(d.id)}" title="${d.done?'点击取消里程碑达成':'宝宝真正掌握后，点击标记里程碑'}">${d.done?'✓ 已达成':`<span class="mi-ic">${ICON('trophy')}</span>里程碑`}</button></div>
      </div>`; }).join('')}</div>`:'';
    body=infoLineHTML('todo-dev','每项能力每天可打卡 1 次，本周次数按各项能力累加；里程碑真正掌握后再标记')
      +`${cur.length?`<div class="card"><div style="display:flex;align-items:baseline;gap:8px">
        <span style="font-size:24px;font-weight:900;color:var(--acc);letter-spacing:-1px">${wkTotal}/${recTotal}</span>
        <span style="font-size:13px;color:var(--tx3);font-weight:600">本周练习次数（当前月龄 ${cur.length} 项能力）</span></div>
        <div class="prog"><i style="width:${recTotal?Math.min(100,Math.round(wkTotal/recTotal*100)):0}%"></i></div>
        <div style="font-size:12px;color:var(--tx3);margin-top:6px">本周已练 ${wkDays} 天 · 已达成里程碑 ${doneCnt}/${cur.length} 项</div></div>`:''}
      ${card(cur,'当前月龄（'+m+'月）')}
      ${card(past,'之前未打卡（可回补）')}
      ${card(next,'即将到来')}
      ${!list.length?'<div class="card"><div class="empty">请先填写宝宝出生日期</div></div>':''}`;
  }
  else{
    const list=rows('caretasks');
    body=infoLineHTML('todo-care','周期性护理任务，完成后自动顺延；点击了解护理知识')
      +`<div class="card pad0">${list.length?list.map(c=>{
        const d=careNext(c);
        const r=d?relText(d):{t:'已完成',c:'t-green'};
        const ok=!d||d>today();
        return `<div class="item" data-open="care:${esc(c.id)}">
        <div class="ck ${ok?'done':''}" data-quick="care:${esc(c.id)}">${ok?'✓':''}</div>
        <div class="bd"><div class="t1">${esc(c.name)}</div>
        <div class="t2"><span class="tag t-cyan">${esc(c.cycle)}</span><span class="tag ${c.owner==='宝爸'?'t-blue':c.owner==='宝妈'?'t-pink':'t-purple'}">${esc(c.owner)}</span>${c.lastDone?'上次 '+esc(c.lastDone):'尚未开始'}</div></div>
        <span class="rt tag ${r.c}">${r.t}</span>
      </div>`}).join(''):'<div class="empty">暂无任务</div>'}</div>`;
  }
    return body;
  };
  return `<div class="segs" data-vp="todo">${segs.map(([k,l])=>`<button data-sub2="todo:${k}" class="${s===k?'on':''}">${l}</button>`).join('')}</div>`
    +`<div class="vp" data-vp="todo">${segs.map(([k])=>`<div class="vpp" data-p="${k}">${mk(k)}</div>`).join('')}</div>`;
}

/* ========== 生长发育评估面板（首页） ========== */
/* 生长发育评估可视化：参考区间条
   设计参考主流育儿 App（亲宝宝 / 育学园 / WHO 生长曲线）：
   一条横向轨道代表「参考范围」，中间绿色带为 P15–P85 常见区间，
   三角+虚线标记「你宝宝」当前所处位置，底部标注 P3 / 中位 / P97。 */
function tagColor(cls){
  const map={'t-ok':'var(--green)','t-amber':'var(--amber)','t-blue':'var(--blue)','t-gray':'var(--tx2)',
    't-low':'var(--red)','t-mid':'var(--amber)','t-high':'var(--red)','t-purple':'var(--purple)',
    't-pink':'var(--pink)','t-cyan':'var(--cyan)','t-green':'var(--green)'};
  return map[cls]||'var(--tx)';
}
function growthBarHTML(ev){
  if(!ev) return '';
  const p3=ev.p3,p15=ev.p15,p50=ev.p50,p85=ev.p85,p97=ev.p97;
  const span=(p97-p3)||1;
  const x15=(p15-p3)/span*100, x85=(p85-p3)/span*100;
  const pin=Math.max(0,Math.min(100,ev.pinPct||0));
  const col=tagColor(ev.tagClass);
  return `<div class="gb" style="--pin:${col}">
    <div class="gb-track">
      <div class="gb-band" style="left:${x15.toFixed(1)}%;right:${(100-x85).toFixed(1)}%"></div>
      <div class="gb-pin" style="left:${pin.toFixed(1)}%">
        <span class="gb-tri"></span>
        <span class="gb-line"></span>
      </div>
    </div>
    <div class="gb-lbl"><span>P3 ${p3}</span><span>中位 ${p50}</span><span>P97 ${p97}</span></div>
  </div>`;
}
function growthAssessHTML(){
  const b=DB.baby, m=monthAge(b.birth);
  const g=rows('growth').slice().sort((x,y)=>x.date<y.date?1:-1)[0];
  const w=g&&(g.weight||g.height)?g:null;
  const items=[
    {k:'体重',unit:'kg',val:w&&w.weight?+w.weight:0,ev:w&&w.weight?evalGrowth5('weight',m,+w.weight):null,icon:ICON('weight')},
    {k:'身高',unit:'cm',val:w&&w.height?+w.height:0,ev:w&&w.height?evalGrowth5('height',m,+w.height):null,icon:ICON('growth')},
    {k:'今日奶量',unit:'ml',val:todayMilk(),ev:todayMilk()?evalMilk(m,todayMilk()):null,icon:ICON('milk')}
  ];
  return `<div class="grow-card">${items.map(it=>{
    const verdict=it.ev?it.ev.level:'待录入';
    const vcls=it.ev?(it.ev.tagClass||'t-gray'):'t-gray';
    const desc=it.ev?it.ev.label:'录入后自动评估';
    const bar=it.k==='今日奶量'?(it.ev?milkBarHTML(it.ev):''):growthBarHTML(it.ev);
    return `<div class="grow-row">
      <div class="grow-hd">
        <div class="grow-k"><span class="gk-ic">${it.icon}</span><span class="gk-t">${it.k}</span></div>
        <div class="grow-r">
          <span class="tag ${vcls}">${verdict}</span>
          <span class="grow-v">${it.val?it.val+it.unit:'—'}</span>
        </div>
      </div>
      ${bar}
      <div class="grow-d">${esc(desc)}</div>
    </div>`;
  }).join('')}</div>`;
}
function milkBarHTML(ev){
  if(!ev) return '';
  const col=ev.pinColor||'var(--tx)';
  return `<div class="gb" style="--pin:${col}">
    <div class="gb-track">
      <div class="gb-band" style="left:${ev.loPct.toFixed(1)}%;right:${(100-ev.hiPct).toFixed(1)}%"></div>
      <div class="gb-pin" style="left:${ev.pinPct.toFixed(1)}%">
        <span class="gb-tri"></span>
        <span class="gb-line"></span>
      </div>
    </div>
    <div class="gb-lbl"><span>0</span><span>参考 ${ev.lo}–${ev.hi}</span><span>${ev.maxV}</span></div>
  </div>`;
}

/* ========== 今日待办（聚焦当日，区别于综合 todo） ========== */
function todayHTML(){
  const items=[];
  rows('vaccines').forEach(v=>{ if(v.status==='待接种'&&v.planDate&&v.plan!==0&&v.planDate<=today())
    items.push({pri:1,date:v.planDate,kind:'vaccine',id:v.id,title:v.name,sub:v.type+'疫苗',icon:'vaccine',done:false,quick:'vaccine:'+v.id,typeLabel:'疫苗',typeCls:'t-pink'}); });
  rows('checkups').forEach(c=>{ if(c.status!=='已完成'&&c.planDate&&c.planDate<=today())
    items.push({pri:2,date:c.planDate,kind:'checkup',id:c.id,title:c.label,sub:c.item||'',icon:'hospital',done:false,quick:'checkup:'+c.id,typeLabel:'儿保',typeCls:'t-blue'}); });
  rows('caretasks').forEach(c=>{ const d=careNext(c); if(d&&d<=today())
    items.push({pri:3,date:d,kind:'care',id:c.id,title:c.name,sub:c.cycle+' · '+c.owner,icon:'care',done:false,quick:'care:'+c.id,typeLabel:'护理',typeCls:'t-cyan'}); });
  curDevTasks().forEach(d=>{ if(!devToday(d.id))
    items.push({pri:4,date:today(),kind:'dev',id:d.id,title:d.content,sub:(d.cat||'')+' · 适应'+d.mFrom+'-'+d.mTo+'月',icon:'target',done:false,typeLabel:'发育',typeCls:'t-amber'});
  });
  rows('todos').forEach(t=>{ if(!t.done&&t.date<=today())
    items.push({pri:5,date:t.date,kind:'todo',id:t.id,title:t.title,sub:(t.time?t.time+' ':'')+(t.note||''),icon:'docs',done:!!t.done,tododone:t.id,time:t.time,typeLabel:'提醒',typeCls:'t-purple'}); });
  items.sort((a,b)=> a.pri-b.pri || (a.date<b.date?-1:a.date>b.date?1:0) || String(a.sub).localeCompare(String(b.sub)));
  const upcoming=rows('todos').filter(t=>!t.done&&t.remind&&t.date>today()&&t.date<=addDays(today(),7)).sort((a,b)=>a.date<b.date?-1:1);
  // 已完成待办（误点可在此找回，点击可撤销回到未办）
  const doneItems=[];
  rows('todos').forEach(t=>{ if(t.done) doneItems.push({kind:'todo',id:t.id,title:t.title,sub:(t.time?t.time+' ':'')+(t.note||''),typeLabel:'提醒',typeCls:'t-purple',undo:'todos:'+t.id,icon:'docs'}); });
  rows('vaccines').forEach(v=>{ if(v.status==='已完成') doneItems.push({kind:'vaccine',id:v.id,title:v.name,sub:v.type+'疫苗',typeLabel:'疫苗',typeCls:'t-pink',undo:'vaccine:'+v.id,icon:'vaccine'}); });
  rows('checkups').forEach(c=>{ if(c.status==='已完成') doneItems.push({kind:'checkup',id:c.id,title:c.label,sub:c.item||'',typeLabel:'儿保',typeCls:'t-blue',undo:'checkup:'+c.id,icon:'hospital'}); });
  rows('caretasks').forEach(c=>{ const d=careNext(c); if(!d||d>today()) doneItems.push({kind:'care',id:c.id,title:c.name,sub:c.cycle+' · '+c.owner,typeLabel:'护理',typeCls:'t-cyan',undo:'care:'+c.id,icon:'care'}); });
  // 注：发育任务打卡已移至「发育任务」页，不在「今日待办」内联打卡，故不在此列「今日已完成」
  const rowHTML=(it)=>{
    const r=relText(it.date);
    const typeTag=`<span class="tag ${it.typeCls}">${esc(it.typeLabel)}</span>`;
    if(it.kind==='dev'){
      // 发育任务：取消「今日打卡」窗格；改为点击进入「发育任务」页打卡 / 标记里程碑
      return `<div class="item todo-item" data-sub2="todo:dev">
        <div class="ic ic-amber">${ICON('target')}</div>
        <div class="bd"><div class="t1">${esc(it.title)}</div><div class="t2">${typeTag}${esc(it.sub||'')}</div></div>
        <span class="rt tag ${r.c}">${esc(r.t)}</span>
      </div>`;
    }
    const ck=it.tododone?`data-tododone="${esc(it.tododone)}"`:`data-quick="${esc(it.quick)}"`;
    const bd = it.kind==='todo' ? `data-act="editTodo:${esc(it.id)}"`:`data-todo="${it.kind}:${esc(it.id)}"`;
    return `<div class="item todo-item ${it.done?'is-done':''}">
      <div class="ck ${it.done?'done':''}" ${ck}>${it.done?'✓':''}</div>
      <div class="bd" ${bd}><div class="t1 ${it.done?'done':''}">${esc(it.title)}</div><div class="t2">${typeTag}${esc(it.sub||'')}</div></div>
      <span class="rt tag ${r.c}">${esc(r.t)}${it.time&&it.kind==='todo'?' · '+esc(it.time):''}</span>
    </div>`;
  };
  const head=`<div class="td-head td-head-plain">
    <div class="td-t"><span>今日待办</span></div>
    <button class="td-plus" data-act="newTodo" title="添加待办" aria-label="添加待办">＋</button>
  </div>
  ${infoLineHTML('today-focus','聚焦今天要做的事')}`;
  const list=items.length?`<div class="card pad0">${items.map(rowHTML).join('')}</div>`:`<div class="card"><div class="empty"><span class="e1">${ICON('star')}</span>今天没有待办<br>安心带娃</div></div>`;
  const up=upcoming.length?`<div class="sec-t"><span class="sti">${ICON('clock')}</span>未来 7 天待提醒</div><div class="card pad0">${upcoming.map(t=>{
    const r=relText(t.date);
    return `<div class="item todo-item" data-act="editTodo:${esc(t.id)}">
      <div class="ic ic-purple">${ICON('docs')}</div>
      <div class="bd"><div class="t1">${esc(t.title)}</div><div class="t2"><span class="tag t-purple">提醒</span>${esc(t.time||'')} ${esc(t.note||'')}</div></div>
      <span class="rt tag ${r.c}">${esc(r.t)}</span>
    </div>`;
  }).join('')}</div>`:'';
  const doneHTML=doneItems.length?`<div class="sec-t"><span class="sti">${ICON('todo')}</span>今日已完成</div>

      const attr=`data-undo="${esc(undoKey)}"`;
      return `<div class="item done-item">
        <div class="ck done" ${attr}>✓</div>
        <div class="bd"><div class="t1 done">${esc(it.title)}</div><div class="t2"><span class="tag ${it.typeCls}">${esc(it.typeLabel)}</span>${esc(it.sub||'')}</div></div>
        <span class="rt undo" ${attr}>撤销</span>

/* ---------- 时光轴 ---------- */
function timelineHTML(){
  const tags=[''].concat(MOMENT_TAGS);
  const f=SUB.timeline||'';
  const mk=(t)=>{
    const all=rows('moments').slice().sort((a,b)=>a.date<b.date?1:-1);
    const list=t?all.filter(x=>(x.tags||[]).indexOf(t)>=0):all;
    const groups={};
    list.forEach(x=>{ const k=String(x.date||'').slice(0,7); if(!k) return; (groups[k]=groups[k]||[]).push(x); });
    const keys=Object.keys(groups).sort().reverse();
    if(!keys.length) return `<div class="vpp" data-p="${esc(t)}"><div class="card"><div class="empty"><span class="e1">${ICON('seedling')}</span>${t?'该标签下还没有记录':'还没有记录<br>哪怕只写一句「今天会翻身了」，一年后都是宝藏'}</div></div></div>`;
    return `<div class="vpp" data-p="${esc(t)}">${keys.map(k=>{
      const ms=monthAge(DB.baby.birth,groups[k][0].date);
      return `<div class="tl-mon"><span class="mb">${k.replace('-','年')}月</span><span class="mc">${ms}月龄 · ${groups[k].length}条</span></div>
      <div class="tl">${groups[k].map(x=>`
        <div class="tl-i"><div class="tl-c" data-open="moment:${esc(x.id)}">
          <div class="d">${esc(x.date)} · ${x.monthAge}月龄 ${(x.tags||[]).map(t=>`<span class="tag t-acc">${esc(t)}</span>`).join('')}</div>
          <div class="x">${esc(x.text||'')}</div>
          ${x.album?`<a class="lk" href="${esc(x.album)}" target="_blank" rel="noopener" data-stop="1"><span class="mini-ic">${ICON('camera')}</span>打开一刻相册</a>`:''}
        </div></div>`).join('')}</div>`;
    }).join('')}</div>`;
  };
  const albums=DB.settings.albums||[];
  const albumTxt=albums.length?`常用相册 ${albums.length} 个，影像统一存一刻相册`:'';
  return `<div class="segs" data-vp="timeline">${tags.map(t=>`<button data-sub2="timeline:${esc(t)}" class="${f===t?'on':''}">${t||'全部'}</button>`).join('')}</div>
  ${albums.length?infoLineHTML('timeline-album',albumTxt):infoLineHTML('timeline-album','影像统一存一刻相册，这里只粘贴分享链接')}
  <div class="vp" data-vp="timeline">${tags.map(t=>mk(t)).join('')}</div>
  <div style="height:26px"></div>`;
}

/* ---------- 习惯养成（分龄） ---------- */
function habitsHTML(){
  const m=monthAge(DB.baby.birth)||0;
  let cur=-1;
  HABITS.forEach((h,i)=>{ if(m>=h.mFrom && (h.mTo===null||m<=h.mTo)) cur=i; });
  const list=HABITS.map((h,i)=>{
    const isCur=i===cur;
    const blk=(title,arr)=>arr&&arr.length?`<div class="hb"><div class="hb-h">${title}</div>${arr.map(x=>`<div class="hb-i">${esc(x)}</div>`).join('')}</div>`:'';
    return `<div class="habit ${isCur?'cur':''}">
      <div class="habit-h"><span class="hl">${esc(h.label)}</span>${isCur?'<span class="tag t-acc">当前阶段</span>':''}</div>
      ${blk('<span class="mini-ic">'+ICON('seedling')+'</span>应养成的习惯',h.habits)}
      ${blk('<span class="mini-ic">'+ICON('bolt')+'</span>明白的道理',h.truths)}
      ${blk('<span class="mini-ic">'+ICON('book')+'</span>掌握的知识',h.knowledge)}

  }).join('');
  const curLabel=cur>=0?HABITS[cur].label:'';

const DEFAULT_MENU=['today','early','growth','moments','manual','all','moment','health','daily','supplies','tools','set','album','guide','intro'];
function menuOrder(){
  let o=DB.settings.menuOrder;
  if(!Array.isArray(o)||!o.length) o=DEFAULT_MENU.slice();
  const seen={}; const valid={}; DEFAULT_MENU.forEach(k=>valid[k]=1);
  o=o.filter(k=>valid[k]&&!seen[k]&&(seen[k]=1));
  DEFAULT_MENU.forEach(k=>{ if(!seen[k]) o.push(k); });
  return o;
}

const FUNC_ACTION={
  today:['nav','today'], early:['nav2','health:early'], growth:['nav2','health:growth'],
  moments:['nav','timeline'], manual:['nav','manual'], all:['nav','allmenu'],
  moment:['form','moment'], health:['form','health'], daily:['form','daily'],
  supplies:['navsub','more:supplies'], tools:['navsub','more:tools'], set:['navsub','more:set'],
  album:['doc','doc3'], guide:['doc','doc9'], intro:['doc','doc10']
};
function runFunc(k){
  const t=FUNC_ACTION[k]; if(!t) return;
  const a=t[0], v=t[1];
  if(a==='nav') go(v);
  else if(a==='nav2'||a==='navsub'){ const p=v.split(':'); go(p[0],p[1],{push:true}); }
  else if(a==='form'){ const F={moment:formMoment,health:formHealth,growth:formGrowth,daily:formDaily}[v]; if(F){ if(sheetStack>0) closeSheet(); F(); } }
  else if(a==='doc') openDoc(v);
}

function drawChart(){
  const cv=$('#cv'); if(!cv||!cv.getContext) return;
  const c=cv.getContext('2d'); if(!c) return;
  const metric=SUB.metric||'weight';
  const box=cv.parentElement;
  const W=box.clientWidth||320, H=box.clientHeight||215, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr;
  c.setTransform(1,0,0,1,0,0); c.scale(dpr,dpr); c.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);
  const pick=(n,f)=>{ const v=(cs.getPropertyValue(n)||'').trim(); return v||f; };
  const C={line:pick('--line2','#E4DAE8'),tx3:pick('--tx3','#9992A8'),
    acc:pick('--acc','#56B8A6'),cyan:'#63A8D8',bg2:pick('--bg2','#fff')};
  const data=rows('growth').filter(g=>g[metric]&&!isNaN(parseFloat(g[metric])))
    .map(g=>({m:g.monthAge||0,v:parseFloat(g[metric])})).sort((a,b)=>a.m-b.m);
  const maxM=Math.max(12,Math.min(36,(data.length?Math.max.apply(null,data.map(d=>d.m)):0)+6));
  const pad={l:36,r:12,t:14,b:24};
  const ref=[]; for(let m=0;m<=maxM;m++){ const p=refAt(metric,m); if(p) ref.push({m:m,v:p}); }
  if(!ref.length) return;
  const sd=GROWTH_SD[metric];
  const vals=ref.map(r=>r.v*(1+sd*1.9)).concat(ref.map(r=>r.v*(1-sd*1.9))).concat(data.map(d=>d.v));
  let vmin=Math.min.apply(null,vals), vmax=Math.max.apply(null,vals);
  const span=(vmax-vmin)||1; vmin-=span*.09; vmax+=span*.09;
  const X=m=>pad.l+(W-pad.l-pad.r)*(m/maxM);
  const Y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-vmin)/(vmax-vmin));
  c.strokeStyle=C.line; c.lineWidth=1; c.font='10px system-ui,sans-serif'; c.fillStyle=C.tx3;
  for(let i=0;i<=4;i++){
    const v=vmin+(vmax-vmin)*i/4, y=Y(v);
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(W-pad.r,y); c.stroke();
    c.textAlign='right'; c.fillText(v.toFixed(metric==='weight'?1:0),pad.l-6,y+3);
  }
  c.textAlign='center';
  const step=maxM>24?6:maxM>12?3:2;
  for(let m=0;m<=maxM;m+=step) c.fillText(m+'月',X(m),H-7);
  c.beginPath();
  ref.forEach((r,i)=>{const y=Y(r.v*(1+sd*1.9)); i?c.lineTo(X(r.m),y):c.moveTo(X(r.m),y);});
  for(let i=ref.length-1;i>=0;i--) c.lineTo(X(ref[i].m),Y(ref[i].v*(1-sd*1.9)));
  c.closePath(); c.fillStyle=C.line; c.globalAlpha=.4; c.fill(); c.globalAlpha=1;
  c.beginPath(); ref.forEach((r,i)=>{const y=Y(r.v); i?c.lineTo(X(r.m),y):c.moveTo(X(r.m),y);});
  c.strokeStyle=C.cyan; c.lineWidth=1.8; c.setLineDash([5,4]); c.stroke(); c.setLineDash([]);
  if(data.length){
    c.beginPath(); data.forEach((d,i)=>{const y=Y(d.v); i?c.lineTo(X(d.m),y):c.moveTo(X(d.m),y);});
    c.strokeStyle=C.acc; c.lineWidth=2.8; c.lineJoin='round'; c.lineCap='round'; c.stroke();
    data.forEach(d=>{
      c.beginPath(); c.arc(X(d.m),Y(d.v),4.5,0,Math.PI*2); c.fillStyle=C.acc; c.fill();
      c.strokeStyle=C.bg2; c.lineWidth=2.2; c.stroke();
    });
  }else{
    c.fillStyle=C.tx3; c.font='12px system-ui,sans-serif'; c.textAlign='center';
    c.fillText('还没有数据，录入后自动生成曲线',W/2,H/2);
  }
}

/* ========== 弹层 ========== */
let sheetSave=null, sheetDel=null, sheetStack=0, suppressPop=false;
function openSheet(title,body,foot){
  const st=$('#shTitle'), sb=$('#shBody'), sf=$('#shFoot');
  if(!st||!sb||!sf) return;
  sheetSave=null; sheetDel=null;
  st.textContent=title; sb.innerHTML=body;
  sf.innerHTML=foot||'<button class="btn gray" data-sh="close">取消</button><button class="btn pri" data-sh="save">保存</button>';
  sb.scrollTop=0;
  $('#mask').classList.add('on'); $('#sheet').classList.add('on');
  // 已有 sheet 打开时（如快捷面板→录入表单），仅替换内容，不递增栈、不压哨兵，
  // 避免异步 history.back 与紧接着的 openSheet 冲突导致表单闪退
  if(sheetStack===0){
    sheetStack++;
    // 用带 hash 的唯一 URL 作哨兵
    try{ history.pushState({sheet:sheetStack}, '', '#s'+sheetStack); }catch(e){}
  }
}
function hideSheetDom(){ $('#mask').classList.remove('on'); $('#sheet').classList.remove('on'); sheetSave=null; sheetDel=null; }
function closeSheet(){
  if(sheetStack>0){
    sheetStack--;
    hideSheetDom();
    // 主动关闭（X/取消/遮罩）：把对应哨兵从历史栈弹掉，避免残留
    try{ suppressPop=true; history.back(); suppressPop=false; }catch(e){}
  } else {
    hideSheetDom();
  }
}

/* ========== 导出 ========== */
function download(name,content,type){
  try{
    const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },600);
    return true;
  }catch(e){ toast('导出失败：'+e.message); return false; }
}

function exportCSV(t){
  const map=CSVMAP[t]; if(!map){ toast('未知表'); return; }
  const q=v=>'"'+String(v==null?'':(Array.isArray(v)?v.join(' / '):v)).replace(/"/g,'""')+'"';
  const lines=[map.map(m=>q(m[0])).join(',')];
  const list=rows(t);
  list.forEach(r=>lines.push(map.map(m=>{
    let v;
    if(m[1]==='_wk') v=devWeek(r.id);
    else if(m[1]==='_st') v=devStreak(r.id);
    else v=m[1]==='done'?(r.done?'已打卡':'未打卡'):r[m[1]];
    return q(v);
  }).join(',')));
  if(download((DB.baby.name||'宝宝')+'-'+t+'-'+today()+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8'))
    toast('已导出 '+list.length+' 条');
}

/* ========== 交互 ========== */
function go(nav,sub,opts={}){
  // 切换视图/子页的历史策略：
  // ① 底部 Tab 同层视图（home/todo/timeline/health）之间切换 → replaceState，不压历史。
  //    避免 iOS/微信「左边缘右滑返回」手势 pop 掉记录后误退回上一 Tab。
  // ② 非 Tab 独立页（today/manual/allmenu/more/important 等）→ pushState 压栈，返回先回进入前页。
  // ③ 从内容区链接进入 Tab 子页（如首页菜单 growth→health:growth、展开全部、卡片"查看曲线"）
  //    也 pushState，让系统返回/右滑先回首页，而不是直接退出应用。
  // 弹窗(sheet)仍用自己的 pushState 栈，返回优先关弹窗，不影响此处。
  const prevView=VIEW;
  VIEW=nav;
  if(sub!==undefined) SUB[nav]=sub;
  if(nav==='more'&&sub&&sub!=='docs') SUB.doc=null;
  navDepth++;
  const st={view:VIEW, sub:SUB[VIEW], depth:navDepth};
  const hash='#'+VIEW+(SUB[VIEW]?':'+SUB[VIEW]:'');
  try{
    // 压栈条件：显式要求 push；或进入非 Tab 独立页；同一独立页内换子页仍 replace。
    if(opts.push || (!TAB_VIEWS[nav] && nav!==prevView)) history.pushState(st, '', hash);
    else history.replaceState(st, '', hash);
  }catch(e){}
  render();
  window.scrollTo(0,0);
}

/* 育儿速查：搜索 + 分类本地过滤（不重渲染，避免输入框失焦）
   搜索索引用 JS 内存维护（DOC_SEARCH），不把长文本塞进 DOM 属性，移动端更稳。 */
const DOC_SEARCH=(typeof DOCS!=='undefined')?DOCS.reduce((m,d)=>{
  m[d.id]=(d.title+' '+(d.sub||'')+' '+((d.body||[]).map(b=>(b.h||'')+' '+((b.p||[]).join(' '))).join(' '))).toLowerCase();
  return m;
},{}):{};
function filterDocs(){
  const q=document.getElementById('docQ');
  const kw=q?q.value.trim().toLowerCase():'';
  const cat=SUB.docCat||'全部';
  document.querySelectorAll('.doc-card').forEach(c=>{
    const id=c.dataset.doc;
    const okCat=(cat==='全部'||c.dataset.cat===cat);
    const okKw=(!kw||(DOC_SEARCH[id]||'').indexOf(kw)>=0);
    c.classList.toggle('hide', !(okCat&&okKw));
  });
}

const SEL='[data-nav],[data-sub2],[data-fab],[data-quick],[data-open],[data-act],[data-sh],'+
  '[data-tag],[data-one],[data-doc],[data-doccat],[data-metric],[data-tltag],[data-mic],[data-todo],[data-tododone],[data-undo],[data-fill],[data-stop],[data-info],'+
  '[data-sw-edit],[data-sw-del]';

document.addEventListener('click',async function(e){
  const t=e.target.closest?e.target.closest(SEL):null;
  if(!t) return;
  const d=t.dataset;

  // 右滑操作：已有打开的 swipe 且点击的不是操作按钮 → 先收起，不触发其它
  const openSw=e.target.closest('.swipe.open');
  if(openSw && !e.target.closest('.swipe-act')){ closeSwipe(openSw); return; }

  if(d.stop!==undefined) return;                       // 外链，放行默认行为
  if(d.mic){ e.preventDefault(); startMic(d.mic,t); return; }
  if(d.info!==undefined){ openInfo(d.info); return; }  // 科普查看
  if(d.fill!==undefined){
    const a=(DB.settings.albums||[])[+d.fill];
    const el=document.getElementById('f_album');
    if(a&&el){ el.value=a.url; toast('已填入：'+a.name); }
    return;
  }
  if(d.tag!==undefined){ t.classList.toggle('on'); return; }
  if(d.one!==undefined){
    const p=t.parentElement;
    if(p) p.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); return;
  }
  if(d.sh){
    if(d.sh==='close') closeSheet();
    else if(d.sh==='save'){
      if(sheetSave){ if(sheetSave()!==false){ closeSheet(); render(); } }
      else closeSheet();
    }
    else if(d.sh==='del'){
      if(await confirmApp('确定删除这条记录？')){
        if(sheetDel) sheetDel();
        closeSheet(); render();
      }
    }
    return;
  }
  if(d.quick){
    const i=d.quick.indexOf(':');
    const k=d.quick.slice(0,i), id=d.quick.slice(i+1);
    e.stopPropagation();
    if(k==='devlog'){
      const r=get('devtasks',id); if(!r) return;
      if(devToday(id)){
        // 今天已打卡则取消今日记录（每日一次切换）
        rows('devlogs').filter(l=>l.k===id && l.date===today()).forEach(l=>del('devlogs',l.id));
        toast('已取消今日练习记录');
      } else {
        put('devlogs',{id:uid(),k:id,date:today(),u:now()});
        const wk=devWeek(id);
        toast('今日已练 · 本周 '+wk+'/'+(r.rec||7)+' 次 🎉');
      }
    } else if(k==='devdone'){
      const r=get('devtasks',id); if(!r) return;
      if(r.done){
        if(!await confirmApp('确定取消该能力的「里程碑达成」标记吗？\n（仅取消标记，已打卡记录保留）')) return;
        put('devtasks',{id:id,done:0,doneDate:''});
        unlinkMoment('todo:dev:'+id);          // 联动：取消里程碑则移除成长足迹联动记录
        toast('已取消里程碑达成');
      } else {
        if(!await confirmApp('确定标记「'+esc(r.content)+'」已掌握？\n标记后仍可持续练习打卡。')) return;
        put('devtasks',{id:id,done:1,doneDate:today()});
        autoMoment('todo:dev:'+id,'达成里程碑：'+r.content,['里程碑']);   // 联动成长足迹
        toast('里程碑达成 ✓');
      }
    } else if(k==='vaccine'){
      const r=get('vaccines',id); if(!r) return;
      const done=r.status==='已完成';
      put('vaccines',{id:id,status:done?'待接种':'已完成',actualDate:done?'':today()});
      if(done){ unlinkMoment('todo:vaccine:'+id); toast('已恢复为待接种'); }
      else { autoMoment('todo:vaccine:'+id,'完成疫苗接种：'+r.name,['疫苗']); toast('已标记完成 ✓'); }
    } else if(k==='checkup'){
      const r=get('checkups',id); if(!r) return;
      const done=r.status==='已完成';
      put('checkups',{id:id,status:done?'待完成':'已完成',actualDate:done?'':today()});
      if(done){ unlinkMoment('todo:checkup:'+id); toast('已恢复为待完成'); }
      else { autoMoment('todo:checkup:'+id,'完成儿保检查：'+r.label,['儿保']); toast('已完成 ✓'); }
    } else if(k==='care'){
      const r=get('caretasks',id); if(!r) return;
      put('caretasks',{id:id,lastDone:today()});
      const nx=careNext(get('caretasks',id));
      toast(nx?'已完成，下次 '+nx:'已完成 ✓');
    }
    render(); return;
  }
  if(d.todo){
    const k=d.todo, id=d.id;
    if(k==='vaccine') formVaccine(id);
    else if(k==='checkup') formCheckup(id);
    else if(k==='care') formCare(id);
    return;
  }
  if(d.tododone){
    const r=get('todos',d.tododone); if(!r) return;
    put('todos',{id:r.id,done:r.done?0:1,doneDate:r.done?'':today()});
    toast(r.done?'已取消完成':'已完成 ✓'); render(); return;
  }
  if(d.undo){
    const i=d.undo.indexOf(':'); const k=d.undo.slice(0,i), id=d.undo.slice(i+1);
    if(k==='todos'){ put('todos',{id:id,done:0,doneDate:''}); toast('已撤销'); }
    else if(k==='vaccine'){ put('vaccines',{id:id,status:'待接种',actualDate:''}); unlinkMoment('todo:vaccine:'+id); toast('已撤销'); }
    else if(k==='checkup'){ put('checkups',{id:id,status:'待完成',actualDate:''}); unlinkMoment('todo:checkup:'+id); toast('已撤销'); }
    else if(k==='care'){ put('caretasks',{id:id,lastDone:''}); toast('已撤销'); }
    else if(k==='dev'){ rows('devlogs').filter(l=>l.k===id && l.date===today()).forEach(l=>del('devlogs',l.id)); toast('已撤销'); }
    render(); return;
  }
  if(d.open){
    const i=d.open.indexOf(':');
    const k=d.open.slice(0,i), id=d.open.slice(i+1);
    const F={moment:formMoment,health:formHealth,growth:formGrowth,daily:formDaily,feed:formFeed,
      vaccine:formVaccine,checkup:formCheckup,care:formCare,supply:formSupply}[k];
    if(F) F(id);
    return;
  }
  if(d.swEdit){
    const i=d.swEdit.indexOf(':'), k=d.swEdit.slice(0,i), id=d.swEdit.slice(i+1);
    const F={moment:formMoment,feed:formFeed,vaccine:formVaccine,checkup:formCheckup,care:formCare,todo:formTodo}[k]; if(F) F(id); closeAllSwipe(); return;
  }
  if(d.swDel){
    const i=d.swDel.indexOf(':'), k=d.swDel.slice(0,i), id=d.swDel.slice(i+1);
    // swipeRow 传入的 kind 是单数(feed/moment)，而数据表名是复数(feeds/moments)，需映射
    const store={feed:'feeds',moment:'moments',vaccine:'vaccines',checkup:'checkups',care:'caretasks',todo:'todos'}[k]||k;
    if(await confirmApp('确定删除这条记录？')){ del(store,id); toast('已删除'); closeAllSwipe(); render(); }
    return;
  }
  if(d.fab){
    const f=$('#fab'); if(f) f.classList.remove('open');
    const F={moment:formMoment,health:formHealth,growth:formGrowth,daily:formDaily,feed:formFeed}[d.fab];
    if(F) F();
    return;
  }
  if(d.doc!==undefined){ if(d.doc) openDoc(d.doc); return; }
  if(d.doccat!==undefined){
    SUB.docCat=d.doccat;
    document.querySelectorAll('#docCats button').forEach(b=>b.classList.toggle('on', b.dataset.doccat===d.doccat));
    filterDocs();
    return;
  }
  if(d.metric){ SUB.metric=d.metric; render(); return; }
  if(d.sub2){
    const segEl=e.target&&e.target.closest?e.target.closest('.segs[data-vp]'):null;
    if(segEl&&segEl._justDragged){ e.preventDefault(); return; }  // 拖拽滚动标签条后，抑制误切换面板
    const p=d.sub2.split(':'); const nav=p[0], key=p[1];
    const vp=document.querySelector('.vp[data-vp="'+nav+'"]');
    if(vp && vp.scrollToPanel){
      const i=(vp.vpBtns||[]).findIndex(b=>b.dataset.sub2===d.sub2);
      if(i>=0){ e.preventDefault(); vp.scrollToPanel(i,true); return; }
    }
    go(nav,key); return;
  }
  if(d.nav){
    // 参考淘宝：点击底部 Tab 回到该 Tab 默认初始页；若元素显式带 data-sub（如更多页卡片），则进入对应子页
    const defaults={today:'vaccine',todo:'vaccine',health:HEALTH_SEGS[0][0],more:'grid'};
    let targetSub;
    if(d.sub!==undefined) targetSub=d.sub;
    else if(defaults[d.nav]!==undefined) targetSub=defaults[d.nav];
    else targetSub=SUB[d.nav];
    // 已在当前视图且子页相同：不重复压栈，避免返回时要连点多次才能出去
    if(VIEW===d.nav && SUB[d.nav]===targetSub) return;
    if(d.sub!==undefined){
      SUB[d.nav]=d.sub;
    } else if(defaults[d.nav]!==undefined){
      SUB[d.nav]=defaults[d.nav];
    }
    if(d.nav==='more' && d.sub===undefined) SUB.doc=null;
    if(d.nav==='timeline' && d.sub===undefined) SUB.timeline='';
    // 显式带有 data-sub 的内容链接（如"查看曲线"）视为内容跳转，压栈返回。
    // 底部 Tab 按钮不带 data-sub，仍走 replaceState，避免 iOS 右滑误退。
    go(d.nav, SUB[d.nav], {push: d.sub!==undefined});
    return;
  }
  if(d.act){ act(d.act); return; }
});

/* 日期变化 → 自动更新月龄 */
document.addEventListener('change',function(e){
  const el=e.target;
  if(el&&el.dataset&&el.dataset.agefor){
    const a=document.getElementById(el.dataset.agefor);
    if(a) a.value=monthAge(DB.baby.birth,el.value);
  }
});

async function act(a){
  const i=a.indexOf(':');
  const k=i<0?a:a.slice(0,i), arg=i<0?'':a.slice(i+1);
  if(k==='editBaby') formBaby();
  else if(k==='openForm'){ const F={moment:formMoment,health:formHealth,growth:formGrowth,daily:formDaily,feed:formFeed}[arg]; if(F){ F(); } }
  else if(k==='openQuick') openQuickRecord();
  else if(k==='openDoc') openDoc(arg);
  else if(k==='openMenuSort') openMenuSort();
  else if(k==='menu'){ runFunc(arg); }
  else if(k==='all'){ const map={moment:['openForm','moment'],health:['openForm','health'],growth:['openForm','growth'],daily:['openForm','daily'],today:['nav','today'],early:['nav2','health:early'],growth2:['nav2','health:growth'],moments:['nav','timeline'],manual:['nav','manual'],supplies:['navsub','more:supplies'],tools:['navsub','more:tools'],set:['navsub','more:set'],album:['openDoc','doc3'],guide:['openDoc','doc9'],intro:['openDoc','doc10']}; const t=map[arg]; if(t){ if(t[0]==='openForm'){ const F={moment:formMoment,health:formHealth,growth:formGrowth,daily:formDaily}[t[1]]; if(F){ if(sheetStack>0) closeSheet(); F(); } } else if(t[0]==='nav'){ go(t[1]); } else if(t[0]==='nav2'||t[0]==='navsub'){ const p=t[1].split(':'); go(p[0],p[1],{push:true}); } else if(t[0]==='openDoc'){ openDoc(t[1]); } } }
  else if(k==='mvUp'||k==='mvDown'){ const o=menuOrder(); const i=o.indexOf(arg); if(i<0) return; const j=k==='mvUp'?i-1:i+1; if(j<0||j>=o.length) return; const x=o.splice(i,1)[0]; o.splice(j,0,x); DB.settings.menuOrder=o; save(); if(VIEW==='home'||VIEW==='allmenu') render(); if(sheetStack>0) closeSheet(); openMenuSort(); }
  else if(k==='goBack') goBack();
  else if(k==='newCare') formCare();
  else if(k==='newTodo') formTodo();
  else if(k==='editTodo') formTodo(arg);
  else if(k==='openIcs') exportICS();
  else if(k==='csv') exportCSV(arg);
  else if(k==='exportBook') exportBook();
  else if(k==='backup'){
    if(download('育儿工作台备份-'+today()+'.json',JSON.stringify(DB,null,1),'application/json'))
      toast('备份已下载');
  }
  else if(k==='restore'){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const data=JSON.parse(rd.result);
          merge(data); save(); render(); toast('恢复完成 ✓');
        }catch(err){ toast('文件格式不正确'); }
      };
      rd.readAsText(f);
    };
    inp.click();
  }
  else if(k==='createSync'){
    if(syncBackend()==='gist'){
      ensureGistToken().then(ok=>{ if(!ok) return; toast('正在创建…'); createCloud().then(id=>{ if(id){ pushCloud(); render(); showSyncCode(); } }); });
    } else {
      toast('正在创建…');
      createCloud().then(id=>{ if(id){ pushCloud(); render(); showSyncCode(); } });
    }
  }
  else if(k==='joinSync'){
    const isGist=syncBackend()==='gist';
    openSheet('加入同步',`
      ${isGist?`<div class="f"><label>GitHub 令牌（与创建方相同）</label><input class="inp" id="f_tok" type="password" placeholder="ghp_..."></div>`:''}
      <div class="f"><label>粘贴对方${isGist?'的 Gist ID':'的同步码'}</label>
      <input class="inp" id="f_sid" placeholder="${isGist?'例如 a1b2c3d4e5f6...':'例如 0195a3f2-xxxx'}"></div>
      <div class="notice">加入后本机已有数据与对方数据<b>合并</b>（不丢失），之后双方任意一端修改都会自动同步。${isGist?'Gist 在创建方的 GitHub 账号下，两人需共用同一令牌才能双向写入。':''}</div>`,
      '<button class="btn gray" data-sh="close">取消</button><button class="btn pri" data-sh="save">加入</button>');
    sheetSave=()=>{
      const raw=val('f_sid');
      if(!raw){ toast('请粘贴同步码'); return false; }
      const id=raw.replace(/[?#].*$/,'').replace(/\/+$/,'').split('/').pop();
      if(!id){ toast('同步码无效'); return false; }
      if(isGist){ const t=val('f_tok'); if(!t){ toast('请填写令牌'); return false; } SYNC.token=t; SYNC.backend='gist'; }
      SYNC.id=id; saveSync();
      toast('正在加入…');
      pullCloud().then(ok=>{ if(ok){ pushCloud(); toast('已加入同步 ✓'); } render(); });
      return true;
    };
  }
  else if(k==='revealToken'){
    const inp=$('#tok_view'); if(!inp) return;
    const on=inp.type==='text';
    inp.type=on?'password':'text';
    toast(on?'已隐藏令牌':'已显示令牌');
  }
  else if(k==='copyToken'){
    const t=SYNC.token||''; if(!t){ toast('无令牌可复制'); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>toast('令牌已复制 ✓'),()=>toast('复制失败，请长按手动复制'));
    } else {
      const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast('令牌已复制 ✓'); }catch(e){ toast('请长按手动复制'); }
      ta.remove();
    }
  }
  else if(k==='copySync'){
    if(!SYNC.id){ toast('尚未创建同步空间'); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(SYNC.id).then(()=>toast('同步码已复制'),()=>toast('复制失败，请长按手动复制'));
    } else {
      const ta=document.createElement('textarea');
      ta.value=SYNC.id; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast('同步码已复制'); }catch(e){ toast('请长按手动复制'); }
      ta.remove();
    }
  }
  else if(k==='leaveSync'){
    if(await confirmApp('退出后本机数据保留，但不再与对方同步。确定？')){
      SYNC.id=''; SYNC.url=''; SYNC.last=0; saveSync(); dot(''); render(); toast('已退出同步');
    }
  }
  else if(k==='setBackend'){
    SYNC.backend=arg; saveSync();
    if(arg==='gist'&&!SYNC.token){ ensureGistToken().then(ok=>{ if(ok) render(); }); }
    else render();
  }
  else if(k==='changeToken'){
    SYNC.token=''; saveSync();
    ensureGistToken().then(ok=>{ if(ok){ saveSync(); render(); toast('令牌已更新 ✓'); } });
  }
  else if(k==='toggleEnc'){
    if(!SYNC.enc){
      if(!secureCtx()){ toast('当前环境不支持加密（需 https 或 localhost）'); return; }
      askPass().then(ok=>{ if(ok){ toast('已开启端到端加密'); render(); } });
    } else { SYNC.enc=0; ENC_KEY=null; saveSync(); toast('已关闭加密'); render(); }
  }
  else if(k==='pull') pullCloud();
  else if(k==='addAlbum'){
    openSheet('添加相册链接',`
      <div class="f"><label>相册名称</label><input class="inp" id="f_an" placeholder="例如 2026年成长日常"></div>
      <div class="f"><label>一刻相册分享链接</label><input class="inp" id="f_au" placeholder="https://..."></div>
      <div class="notice">在一刻相册里进入共享相册 → 分享 → 复制链接，粘贴到这里。建议按月或按大类建 2-3 个即可。</div>`);
    sheetSave=()=>{
      if(!val('f_au')){ toast('请填写链接'); return false; }
      DB.settings.albums=(DB.settings.albums||[]).concat([{name:val('f_an')||'相册',url:val('f_au')}]);
      DB.settings.u=now(); save(); toast('已添加 ✓'); return true;
    };
  }
  else if(k==='delAlbum'){
    const idx=+arg;
    if(DB.settings.albums&&DB.settings.albums[idx]!==undefined){
      DB.settings.albums.splice(idx,1); DB.settings.u=now(); save(); render(); toast('已删除');
    }
  }
  else if(k==='setMe'){ DB.settings.me=arg; DB.settings.u=now(); save(); render(); }
  else if(k==='setTheme'){ DB.settings.theme=arg; DB.settings.u=now(); save(); applyTheme(); render(); }
  else if(k==='toggleNip'){
    DB.settings.showNonNip=!DB.settings.showNonNip;
    DB.settings.u=now(); save();
    if(DB.settings.showNonNip){
      const n=seed(false);
      toast('已加入二类疫苗计划'+(n?'（'+n+'剂）':''));
    } else {
      let c=0;
      (DB.vaccines||[]).forEach(v=>{ if(v.type==='二类'&&!v.del&&v.status!=='已完成'){ v.del=1; v.u=now(); c++; } });
      save(); toast('已移除 '+c+' 剂未完成的二类疫苗');
    }
    render();
  }
  else if(k==='setVaxPlan'){
    const sp=arg.split(':'); const vax=sp[0], val=sp[1]==='1'?1:0;
    rows('vaccines').forEach(v=>{ if(v.vax===vax){ v.plan=val; v.u=now(); } });
    save(); render();
    toast(val?'已纳入计划 ✓':'已标记暂不接种');
  }
  else if(k==='music'){
    // 播放/停止 某类安抚音
    const cards=document.querySelectorAll('.music-card');
    const target=Array.from(cards).find(c=>c.dataset.act==='music:'+arg);
    const isOn=target&&target.classList.contains('on');
    cards.forEach(c=>c.classList.remove('on'));
    if(!isOn){
      try{ Music.play(arg); if(target) target.classList.add('on'); }
      catch(e){ toast('播放失败：'+e.message); }
    } else {
      stopMusic();
    }
  }
  else if(k==='setBabyStatus'){
    // 弹层让用户选择状态
    const opts=BABY_STATUS.map(s=>`<span class="status-pill ${DB.baby.status===s.k?'on':''}" data-act="pickStatus:${s.k}" style="${DB.baby.status===s.k?`background:${s.color}`:''}">${s.emoji} ${s.label}</span>`).join('');
    openSheet('宝宝当前状态',`<div class="f"><label>选择宝宝当前的状态</label><div class="status-pills">${opts}</div></div>`,'');
  }
  else if(k==='pickStatus'){
    DB.baby.status=arg; DB.baby.u=now(); save(); render(); closeSheet();
  }
  else if(k==='goEarly'){
    SUB.month=+arg; render(); window.scrollTo(0,0);
  }
  else if(k==='delHealth'){
    const r=get('health',arg); if(!r) return;
    if(await confirmApp('删除这条健康记录？')){ del('health',arg); render(); toast('已删除'); }

/* 语音输入 */
function startMic(id,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const el=document.getElementById(id);
  if(!SR){ toast('该浏览器不支持，请用输入法的语音键'); if(el) el.focus(); return; }
  if(window._rec){ try{ window._rec.stop(); }catch(e){} window._rec=null; btn.classList.remove('rec'); return; }
  let r;
  try{ r=new SR(); }catch(e){ toast('语音功能不可用'); return; }
  r.lang='zh-CN'; r.continuous=false; r.interimResults=false;
  r.onresult=ev=>{
    const txt=ev.results[0][0].transcript;
    if(el) el.value=(el.value?el.value+' ':'')+txt;
  };
  r.onerror=()=>toast('没听清，再试一次');
  r.onend=()=>{ btn.classList.remove('rec'); window._rec=null; };
  try{ r.start(); window._rec=r; btn.classList.add('rec'); toast('请说话…'); }
  catch(e){ toast('语音启动失败'); }
}

function applyTheme(){
  const t=(DB.settings&&DB.settings.theme)||'auto';
  const dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const mt=document.querySelector('meta[name=theme-color]');
  if(mt) mt.content=dark?'#0F1419':'#56B8A6';
  if(VIEW==='health'&&SUB.health==='growth') setTimeout(drawChart,30);
}

  bar.querySelector('#installX').onclick=()=>{ try{localStorage.setItem('installTip','1');}catch(e){} bar.remove(); };
  const go=bar.querySelector('#installGo');
  if(deferredPrompt){
    go.textContent='一键安装';
    go.onclick=()=>{ deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; bar.remove(); }).catch(()=>{}); };
  } else {
    go.onclick=()=>{ toast('请点浏览器右上角 ⋮ 菜单 → 添加到主屏幕'); };
  }
}

/* 右滑操作（iOS Mail 式：右滑露出左侧「修改/删除」） */
let swState=null;
function closeSwipe(el){ if(!el) return; const bd=el.querySelector('.swipe-bd'); if(bd){ bd.style.transition='transform .25s'; bd.style.transform=''; } el.classList.remove('open'); }
function closeAllSwipe(){ document.querySelectorAll('.swipe.open').forEach(closeSwipe); }
function initSwipe(){
  if(window.__swipeInited) return; window.__swipeInited=true;
  document.addEventListener('touchstart',function(e){
    const sw=e.target.closest?e.target.closest('.swipe'):null; if(!sw) return;
    if(!sw.classList.contains('open')) document.querySelectorAll('.swipe.open').forEach(function(o){ if(o!==sw) closeSwipe(o); });
    const bd=sw.querySelector('.swipe-bd'), act=sw.querySelector('.swipe-act');
    swState={sw:sw,bd:bd,actW:(act?act.offsetWidth:0)||120,startX:e.touches[0].clientX,startY:e.touches[0].clientY,moved:false,horiz:false,open:sw.classList.contains('open')};
    if(bd) bd.style.transition='none';
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!swState) return;
    const dx=e.touches[0].clientX-swState.startX, dy=e.touches[0].clientY-swState.startY;
    if(!swState.moved){ if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)) swState.horiz=true; else if(Math.abs(dy)>10) swState.horiz=false; swState.moved=true; }
    if(swState.horiz){
      let x=swState.open?(-swState.actW+dx):dx;
      x=Math.min(0,Math.max(-swState.actW,x));
      swState.bd.style.transform='translateX('+x+'px)';
      if(e.cancelable) e.preventDefault();
    }
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(!swState) return;
    const dx=e.changedTouches[0].clientX-swState.startX, bd=swState.bd;
    if(bd) bd.style.transition='transform .25s';
    if(swState.horiz){
      // 左滑超过阈值→展开；右滑超过阈值→收起；未过阈值→保持原状
      let open;
      if(dx < -50) open = true;
      else if(dx > 50) open = false;
      else open = swState.open;
      if(open){ swState.sw.classList.add('open'); if(bd) bd.style.transform='translateX(-'+swState.actW+'px)'; }
      else { swState.sw.classList.remove('open'); if(bd) bd.style.transform='translateX(0)'; }
    }
    swState=null;
  },{passive:true});
}

/* ========== 全局「点按钮不横移」守卫（v6.11 根治） ==========
   根因：浏览器让被点击的 button 获得焦点后，会把它滚进**每一个**可滚动祖先的可视区。
   于是点「24月」「体重」这类按钮时，.month-bar / .segs / .vp 会各自"自己滑一遍"；
   .vp 被横滚还会连带触发滚动联动，让顶部分类标签依次高亮 —— 即用户看到的"导航栏滑动"。
   注意 tabindex="-1" 只挡键盘 Tab，挡不住鼠标/触摸聚焦，必须在这一层根治。
   做法：按下时快照所有横向可滚动祖先的 scrollLeft；桌面直接 preventDefault 阻断聚焦；
   移动端 touchstart 不能 preventDefault（会吞掉 click），改为在 focusin / 抬手后
   同步 + rAF + 延时逐次还原，任何可见横移都来不及发生。 */
let cancelFocusGuard=function(){};   // 由 initFocusScrollGuard 赋值：程序化滚动前调用，防止守卫把主动滚动拉回
function initFocusScrollGuard(){
  let snap=null, tid=0, sx=0, sy=0;
  const isForm=function(t){
    if(!t||!t.tagName) return false;
    return /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
  };
  // 收集元素到 body 之间所有「可横向滚动」的祖先及其当前位置
  const shot=function(el){
    const arr=[];
    for(let n=el; n && n!==document.body && n!==document.documentElement; n=n.parentElement){
      if(n.classList && n.classList.contains('vp')) continue;   // 内容横滑容器由 ViewPager 主动控制，焦点守卫不还原它（否则会把主动切换拉回默认面板）
      if(n.scrollWidth-n.clientWidth>1) arr.push([n,n.scrollLeft]);
    }
    return arr.length?arr:null;
  };
  // 还原时临时关掉 scroll-behavior，确保是瞬时归位而非再来一段动画
  const restore=function(){
    if(!snap) return;
    for(let i=0;i<snap.length;i++){
      const n=snap[i][0];
      if(!n.isConnected) continue;
      if(Math.abs(n.scrollLeft-snap[i][1])>0.5){
        const sb=n.style.scrollBehavior;
        n.style.scrollBehavior='auto';
        n.scrollLeft=snap[i][1];
        n.style.scrollBehavior=sb;
      }
    }
  };
  const settle=function(){
    restore();
    requestAnimationFrame(restore);
    clearTimeout(tid);
    tid=setTimeout(function(){ restore(); snap=null; },140);
  };
  const hit=function(e){
    if(isForm(e.target)) return null;
    const t=e.target;
    return (t&&t.closest)?t.closest('button,.status-pill,[data-act],[data-sub2],[data-metric],[data-nav],[data-fab]'):null;
  };
  // 桌面：mousedown 阻断默认聚焦行为（不影响 click 派发）
  document.addEventListener('mousedown',function(e){
    const b=hit(e); if(!b){ snap=null; return; }
    snap=shot(b);
    if(snap) e.preventDefault();   // 仅当按钮确实在横向滚动容器内才阻断聚焦，弹窗表单行为零影响
  },true);
  // 移动端：快照 + 抬手还原
  document.addEventListener('touchstart',function(e){
    const b=hit(e); if(!b){ snap=null; return; }
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    snap=shot(b);
  },{capture:true,passive:true});
  // 手指一旦移动就判定为「滑动手势」而非点击，立即放弃守卫，绝不干扰面板横滑/页面纵滑
  document.addEventListener('touchmove',function(e){
    if(!snap) return;
    const t=e.touches[0];
    if(Math.abs(t.clientX-sx)>6||Math.abs(t.clientY-sy)>6) cancelFocusGuard();
  },{capture:true,passive:true});
  document.addEventListener('touchend',settle,{capture:true,passive:true});
  document.addEventListener('focusin',function(e){
    if(isForm(e.target)) { snap=null; return; }   // 表单聚焦保留原生滚动行为
    if(snap) settle();
  },true);
  cancelFocusGuard=function(){ snap=null; clearTimeout(tid); };
}

/* 同页分类横滑（小红书式 ViewPager）：顶部标签 + 内容整块横滑、平滑吸附、标签跟随高亮。
   原生 CSS scroll-snap 提供跟手 + 弹性归位，比 translateX 跟手更顺滑自然。 */
function initViewPager(){
  document.querySelectorAll('.vp[data-vp]').forEach(function(vp){
    const nav=vp.dataset.vp;
    const segs=document.querySelector('.segs[data-vp="'+nav+'"]');
    if(!segs) return;
    const btns=[].slice.call(segs.querySelectorAll('button'));
    const panels=[].slice.call(vp.querySelectorAll('.vpp'));
    if(!btns.length||!panels.length) return;
    // 给本 vp 内所有分类标签/指标按钮（含嵌套的指标 segs 如体重/身高）设 tabindex=-1，
    // 从源头消除「点击按钮 → 浏览器把标签条自动滚入可视区」引发的横移
    vp.querySelectorAll('.segs button').forEach(function(b){ b.setAttribute('tabindex','-1'); });
    // 激活标签是否已完整出现在标签条可视区内
    const isVisible=function(b){ const r=b.getBoundingClientRect(), s=segs.getBoundingClientRect(); return r.left>=s.left-1 && r.right<=s.right+1; };
    // 标签条跟随：仅在激活项移出可视区时才滚动（手动滑动时），点击时本就在可视区 → 不动，杜绝“从左到右滑动”
    const followSegs=function(i){ const b=btns[i]; if(!b||isVisible(b)) return; segs.scrollLeft=Math.max(0,b.offsetLeft-12); };
    /* 点击标签：只切换内容面板 + 高亮，禁止顶部导航栏(.segs)自身横移。
       根因：iOS/微信WebView 在 tap 屏幕边缘外的标签按钮时，会把可横向滚动的
       .segs 自动滚动到让该按钮可见，用户感知为"导航栏滑动一遍"。
       桌面用 mousedown preventDefault 阻止 focus 滚动；移动端区分"点击标签"与
       "手动滑动标签条"——判定为点击才在 touchend 阻止 focus 并手动切换。 */
    btns.forEach(function(b,bi){
      b.setAttribute('tabindex','-1');   // 非键盘可达：避免点按触发 focus 导致 .segs 自动横移
      b.addEventListener('mousedown', function(e){ e.preventDefault(); }, {passive:false});
      let tsx=0, tsy=0, tmoved=false, savedLeft=0;
      b.addEventListener('touchstart', function(e){ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; tmoved=false; savedLeft=segs.scrollLeft; }, {passive:true});
      b.addEventListener('touchmove', function(e){ if(Math.abs(e.touches[0].clientX-tsx)>8||Math.abs(e.touches[0].clientY-tsy)>8) tmoved=true; }, {passive:true});
      b.addEventListener('touchend', function(e){
        if(tmoved) return;            // 用户在滑动标签条，交给原生 .segs 滚动，不切换
        e.preventDefault();           // 阻止 focus 自动滚动 + 抑制原生 click（避免双触发）
        // 兜底：点按触发 .segs 焦点自动横移时，立即归位（scroll-behavior:auto 故瞬时、无可见滑动）
        if(segs.scrollLeft!==savedLeft) segs.scrollLeft=savedLeft;
        requestAnimationFrame(function(){ if(segs.scrollLeft!==savedLeft) segs.scrollLeft=savedLeft; });
        if(vp.scrollToPanel) vp.scrollToPanel(bi,true);
      }, {passive:false});
    });
    // 嵌套指标 segs（体重/身高/头围等，无 data-vp）：仅阻止桌面聚焦横移，切换由 data-metric 全局处理器负责
    vp.querySelectorAll('.segs:not([data-vp]) button').forEach(function(b){
      b.addEventListener('mousedown', function(e){ e.preventDefault(); }, {passive:false});
    });
    /* 桌面：允许在标签条空白/间隔处按住拖动横向滚动（移动端走原生 touch 横滑，互不冲突）。
       关键：仅在「非按钮」区域发起拖拽——点按标签按钮永远是纯 click，必定切换到所点标签，
       不会被拖拽阈值误吞（旧版从按钮发起拖拽，鼠标轻微位移>5px 即 _justDragged 抑制 click，
       导致点了标签却停在原面板、看似"跳到默认标签页"）。
       真正从条上拖拽后标记 _justDragged，抑制松手落在按钮上误触发的 click。 */
    segs.addEventListener('mousedown', function(e){
      if(e.button!==0) return;
      if(e.target.closest('button')) return;   // 点/拖标签按钮由按钮自身逻辑处理，不在条上发起拖拽
      const startX=e.clientX, startLeft=segs.scrollLeft;
      let moved=false;
      const mm=function(ev){
        const dx=ev.clientX-startX;
        if(!moved && Math.abs(dx)>5){ moved=true; segs.style.cursor='grabbing'; }
        if(moved){ segs.scrollLeft=startLeft-dx; if(ev.cancelable) ev.preventDefault(); }
      };
      const mu=function(){
        document.removeEventListener('mousemove',mm,true);
        document.removeEventListener('mouseup',mu,true);
        segs.style.cursor='';
        if(moved){ segs._justDragged=true; setTimeout(function(){ segs._justDragged=false; },0); }
      };
      document.addEventListener('mousemove',mm,true);
      document.addEventListener('mouseup',mu,true);
    });
    const w=function(){ return vp.clientWidth||vp.offsetWidth||1; };
    const setActive=function(i,save){
      i=Math.max(0,Math.min(panels.length-1,i));
      btns.forEach(function(b,bi){ b.classList.toggle('on',bi===i); });
      vp.dataset.ai=i;
      const key=btns[i].dataset.sub2?btns[i].dataset.sub2.split(':')[1]:panels[i].dataset.p;
      if(save && SUB[nav]!==key){ SUB[nav]=key; }
      if(nav==='health' && key==='growth'){ requestAnimationFrame(drawChart); }
    };
    let animating=false;   // 程序化平滑滚动期间：抑制逐帧标签更新，避免闪烁/跳动
    vp.scrollToPanel=function(i,smooth){
      i=Math.max(0,Math.min(panels.length-1,i||0));
      cancelFocusGuard();   // 主动切换面板：解除焦点守卫，否则滚动会被还原回原位
      if(smooth){
        // 临时关闭强制吸附，避免与平滑滚动打架产生“晃动”；滚动结束后再恢复吸附
        animating=true;
        vp.style.scrollSnapType='none';
        vp.scrollTo({left:i*w(),behavior:'smooth'});
        const reenable=function(){ if(vp.isConnected) vp.style.scrollSnapType=''; animating=false; vp.removeEventListener('scrollend',reenable); };
        if('onscrollend' in window) vp.addEventListener('scrollend',reenable,{once:true});
        else setTimeout(reenable,500);
      } else {
        vp.scrollTo({left:i*w(),behavior:'auto'});
      }
      setActive(i,true);
      followSegs(i);
    };
    vp.vpBtns=btns;
    // 初始定位：同步完成（避免重建 DOM 后浏览器从首面板「吸附滑动」到当前面板），
    // 临时关闭 scroll-snap 再恢复，确保无可见动画；标签条仅在激活项不可见时才跟随
    const ai=Math.max(0,panels.findIndex(function(p){ return p.dataset.p===SUB[nav]; }));
    vp.style.scrollSnapType='none';
    vp.scrollLeft=ai*w();
    setActive(ai||0,false);
    if(btns[ai] && !isVisible(btns[ai])) segs.scrollLeft=Math.max(0,btns[ai].offsetLeft-12);
    requestAnimationFrame(function(){ if(vp.isConnected) vp.style.scrollSnapType=''; });
    // 滚动联动：手动滑动时实时同步激活面板 + 标签高亮 + 标签条跟随（程序化动画期间跳过）
    let ticking=false;
    vp.addEventListener('scroll',function(){
      if(animating||ticking) return; ticking=true;
      requestAnimationFrame(function(){
        const i=Math.round(vp.scrollLeft/w());
        if(i!==+vp.dataset.ai){ setActive(i,true); followSegs(i); }
        ticking=false;
      });
    },{passive:true});
  });
}

function boot(){
  load();
  applyTheme();
  if(DB.baby.birth){ seed(false); migrateVaccines(); }   // 先排期，再做 v1.5->v1.6 一次性迁移（清孤儿、回填已完成）
  render();
  initSwipe();
  initFocusScrollGuard();   // 全局委托，绑一次即可，不受 render 重建 DOM 影响
  // 把初始页固化为一条历史状态，使「从首个子页返回」能正确落回首页/当前页，
  // 而非因初始态无 state 而在 popstate 里被忽略
  try{ history.replaceState({view:VIEW, sub:SUB[VIEW], depth:navDepth}, '', '#'+VIEW+(SUB[VIEW]?':'+SUB[VIEW]:'')); }catch(e){}
  if(SYNC.id){
    dot('on');
    const start=()=>pullCloud(true);
    if(SYNC.enc && !secureCtx()){ dot('err'); toast('加密同步需在 https 或 localhost 环境才能拉取'); }
    else if(SYNC.enc){ askPass().then(ok=>{ if(ok) start(); else dot('err'); }); }
    else start();
  }

  const sc=$('#shClose'); if(sc) sc.onclick=closeSheet;
  const mk=$('#mask'); if(mk) mk.onclick=closeSheet;
  // 回到顶部：取消独立按钮，改为「双击底部导航栏」触发（桌面 dblclick / 移动端 300ms 内双触）
  const tbEl=$('#tabbar');
  if(tbEl){
    const scrollTop=()=>{ try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); } };
    tbEl.addEventListener('dblclick', function(e){ e.preventDefault(); scrollTop(); });
    let lastTapT=0;
    tbEl.addEventListener('touchend', function(){
      const now=Date.now();
      if(now-lastTapT<300) scrollTop();   // 双击：第二次触发的 300ms 内再触发即回到顶部
      lastTapT=now;
    }, {passive:true});
  }

  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
  // 手机系统返回键 / 右滑返回手势：弹窗打开时先关弹窗，而不是直接退出应用。
  // 用计数栈消费手势：每次返回关一层弹窗；只要还有弹窗就重装哨兵，把下一跳返回也兜住。
  window.addEventListener('popstate',function(e){
    if(suppressPop) return;
    if(sheetStack>0){
      sheetStack--;
      hideSheetDom();
      if(sheetStack>0){ try{ history.pushState({sheet:sheetStack}, '', '#s'+sheetStack); }catch(e){} }
    } else if(e.state && e.state.view){
      // 弹窗关完了，按历史状态恢复上一页
      navDepth=e.state.depth;
      VIEW=e.state.view;
      SUB[e.state.view]=e.state.sub;
      // 返回时清理对应视图下的「详情」子状态（文档详情、早教工具详情），
      // 避免回退后仍停留详情页而跳过了列表页
      if(VIEW==='more') SUB.doc=null;
      if(VIEW==='health') SUB.early=null;
      render();
      window.scrollTo(0,0);
    }
  });
  document.addEventListener('keypress',e=>{
    if(e.key==='Enter'&&e.target&&e.target.id==='qsup'){ e.preventDefault(); act('addSup'); }
  });
  document.addEventListener('input',e=>{
    if(e.target&&e.target.id==='docQ'){ filterDocs(); }
  });
  window.addEventListener('resize',()=>{ if(VIEW==='health'&&SUB.health==='growth') drawChart(); });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&SYNC.id) pullCloud(true); });
  if(window.matchMedia){
    const mq=window.matchMedia('(prefers-color-scheme:dark)');
    const h=()=>{ if((DB.settings.theme||'auto')==='auto') applyTheme(); };
    mq.addEventListener?mq.addEventListener('change',h):mq.addListener&&mq.addListener(h);
  }
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    // 注册 SW：新版本部署后自动生效。新版 SW 安装完成后会在后台等待，
    // 通过 postMessage 触发 skipWaiting；controllerchange 时主动 reload。
    if(navigator.serviceWorker){
      navigator.serviceWorker.register('sw.js').then(reg=>{
        let waitingWorker=null;
        const promptUpdate=()=>{
          if(!waitingWorker) return;
          toast('新版本已就绪，点击刷新',{time:5000,onClick:()=>waitingWorker.postMessage({type:'SKIP_WAITING'})});
        };
        reg.addEventListener('updatefound',()=>{
          const newWorker=reg.installing;
          newWorker.addEventListener('statechange',()=>{
            if(newWorker.state==='installed' && navigator.serviceWorker.controller){
              waitingWorker=newWorker;
              setTimeout(promptUpdate,1200);
            }
          });

        if(_swReloading) return; _swReloading=true;
        const mask=document.getElementById('mask');

        if(mask && mask.classList.contains('on')) setTimeout(()=>location.reload(), 800);
        else location.reload();
      });
    }
  }
  // 安卓 PWA 安装引导
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; renderInstallBar(); });
  if(/android/i.test(navigator.userAgent||'')) renderInstallBar();
  // 实时同步：动态间隔自动拉取云端（遇429自动退避），双端近实时；并持续访问避免75天闲置过期
  schedulePull();
  // 测试钩子
  window.__BW={get DB(){return DB;},get SYNC(){return SYNC;},get VIEW(){return VIEW;},SUB:SUB,
    render:render,seed:seed,load:load,migrateVaccines:migrateVaccines,allTodos:allTodos,monthAge:monthAge,evalGrowth:evalGrowth,
    // v2.0 新增
    EARLY_DEV_MONTHLY:EARLY_DEV_MONTHLY,MILK_REF:MILK_REF,GROWTH_REF_5:GROWTH_REF_5,BABY_STATUS:BABY_STATUS,
    evalGrowth5:evalGrowth5,evalMilk:evalMilk,Music:Music,
